name: StegVerse SDK Validation (Optional Hosted)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Run standard-library evaluator relationship validation
        run: |
          set -eu
          cd /tmp/source
          python -m unittest tests.test_demo_terms tests.test_evaluation_relationship tests.test_evaluator_llm_entry
      - name: Run repository-native source validators available without dependency installation
        run: |
          set -eu
          cd /tmp/source
          python scripts/verify_public_sdk_surface.py
          python scripts/verify_universal_entry_envelope.py
          python scripts/verify_free_tier_metadata_ingestion.py
          echo 'SDK_OPTIONAL_HOSTED_VALIDATION_PASS'
          echo 'Full dependency-bearing test/build suites remain sovereign/local repository commands and are not release-gated on GitHub Actions.'
          echo 'This workflow cannot publish, tag, push, upload release artifacts, request OIDC, or receive TV/TVC credentials.'
