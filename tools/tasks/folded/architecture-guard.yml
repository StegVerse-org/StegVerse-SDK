name: Architecture Guard (Optional Hosted Validation)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Validate architecture locally with standard library
        run: |
          set -eu
          cd /tmp/source
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          manifest_path = Path('stegverse.architecture.json')
          if not manifest_path.exists():
              raise SystemExit('ARCHITECTURE_GUARD_FAIL: manifest missing')
          manifest = json.loads(manifest_path.read_text())
          violations=[]; syntax=[]; forbidden=[]
          expected=manifest.get('expected_structure',{}); rules=manifest.get('file_rules',{})
          def check(rel,spec,base=''):
              p=Path(base)/rel if base else Path(rel)
              exists=p.is_dir() if rel.endswith('/') else p.is_file()
              if spec.get('required',False) and not exists: violations.append(f'MISSING required: {rel}')
              if exists:
                  for sub,subspec in spec.get('subdirs',{}).items(): check(sub,subspec,str(p))
          for rel,spec in expected.items(): check(rel,spec)
          for root,dirs,files in os.walk('.'):
              dirs[:]=[d for d in dirs if d not in {'.git','__pycache__','node_modules','.venv','venv'}]
              for f in files:
                  rel=os.path.join(root,f)
                  for pattern in rules.get('forbidden_patterns',[]):
                      if re.search(pattern,rel): forbidden.append(f'{pattern}: {rel}')
                  if f.endswith('.py') and not f.startswith('test_') and f!='__init__.py' and not re.match(r'^[a-z0-9_]+\.py$',f):
                      syntax.append(f)
          total=len(violations)+len(syntax)+len(forbidden)
          print(json.dumps({'violations':violations,'naming':syntax,'forbidden':forbidden,'total':total},indent=2))
          if total and manifest.get('enforcement')=='strict': sys.exit(1)
          PY
          echo 'ARCHITECTURE_GUARD_OPTIONAL_HOSTED_PASS'
          echo 'Canonical validation remains locally executable and does not depend on this hosted runner.'
