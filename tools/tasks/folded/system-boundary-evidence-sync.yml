name: System Boundary Evidence Validation (Optional Hosted)

# Optional convenience validation only. Canonical evidence synchronization is
# sovereign/local and must not depend on GitHub Actions availability, billing,
# authenticated API access, repository mutation, or GitHub workflow evidence.

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - name: Prove hosted evidence lane is non-authorizing
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          echo 'SYSTEM_BOUNDARY_EVIDENCE_HOSTED_MUTATION_DISABLED'
          echo 'Canonical evidence synchronization belongs to sovereign/local repository tooling.'
          echo 'GitHub Actions may not fetch authenticated workflow evidence, commit evidence, push repository state, or act as a continuity trigger.'
