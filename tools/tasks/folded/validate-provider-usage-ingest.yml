name: Validate Provider Usage Ingestion (Optional Hosted)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Compile provider-usage integration
        run: |
          set -eu
          cd /tmp/source
          python -m compileall -q stegverse/provider_usage_ingest.py tests/test_provider_usage_ingest.py
          echo 'PROVIDER_USAGE_SOURCE_COMPILE_PASS'
          echo 'Full dependency-bearing test execution remains locally executable and is not gated on this hosted runner.'
