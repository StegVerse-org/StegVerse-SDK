name: SDK capability map conformance

# Every pull request. A capability can be introduced in a module no path filter
# anticipates, and the job takes about twelve seconds.
on:
  pull_request:
  workflow_dispatch:

jobs:
  capability-map:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .

      - name: Every installed route is invocable or carries a declared exemption
        run: python -m unittest tests.test_capability_map_conformance -v

      - name: Every registered SDK capability is bound, and no SDK subsystem is undeclared
        run: python -m unittest tests.test_connector_capability_overlay -v

      - name: Publish the reconciled capability map
        run: |
          python -m stegverse capability-map | tee /tmp/capability-map.json
          python - <<'PY'
          import json
          report = json.load(open("/tmp/capability-map.json", encoding="utf-8"))
          assert report["drift_count"] == 0, report
          assert report["expired_exemption_count"] == 0, report
          assert report["exemption_baseline_matches"] is True, report
          assert report["grants_execution_authority"] is False
          print("CAPABILITY_MAP_CONFORMANCE_PASS"
                f" invocable={report['evaluator_invocable_count']}"
                f" exempt={report['declared_exemption_count']}"
                f" drift={report['drift_count']}"
                f" expired={report['expired_exemption_count']}")
          PY

      - name: Publish the connector capability overlay
        run: |
          python - <<'PY' | tee /tmp/connector-capability-overlay.json
          import json
          from pathlib import Path
          from stegverse.connector_capability_overlay import reconcile_overlay
          from stegverse.evaluator_review_intr import REQUEST_SCHEMA
          from stegverse.publisher_return_binding import PUBLISHER_RETURN_SCHEMA
          from stegverse.review_publisher_transfer import TRANSFER_SCHEMA
          payload = json.loads(Path(
              "data/universal-intr-connector-sdk-profiles.baseline.json"
          ).read_text(encoding="utf-8"))
          registry = {
              "schema": payload["canonical_registry"]["registry_schema"],
              "state": payload["canonical_registry"]["registry_state"],
              "profiles": payload["profiles"],
          }
          report = reconcile_overlay(registry, bound_payload_schemas=(
              REQUEST_SCHEMA, TRANSFER_SCHEMA, PUBLISHER_RETURN_SCHEMA))
          assert report["disposition"] == "ALLOW", report
          assert report["failures"] == [], report
          assert report["undeclared_sdk_subsystems"] == [], report
          assert report["authority_effect"] == "NONE_SOURCE_RECONCILIATION_ONLY"
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-connector-capability-overlay
          path: /tmp/connector-capability-overlay.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-capability-map
          path: /tmp/capability-map.json
          if-no-files-found: warn
