name: Communication Edge SDK Demo Validation

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "stegverse/communication_edge_demo.py"
      - "stegverse/communication_edge_cli.py"
      - "stegverse/demo_data/communication_edge_demo.json"
      - "examples/communication_edge_demo.json"
      - "tests/test_communication_edge_demo.py"
      - "scripts/run_communication_edge_demo.py"
      - "scripts/run_pinned_communication_source_integration.py"
      - "docs/COMMUNICATION_EDGE_SDK_DEMO.md"
      - "COMMUNICATION_EDGE_SDK_DEMO_MIRROR_HANDOFF.md"
      - ".github/workflows/communication-edge-demo-validation.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "stegverse/communication_edge_demo.py"
      - "stegverse/communication_edge_cli.py"
      - "stegverse/demo_data/communication_edge_demo.json"
      - "examples/communication_edge_demo.json"
      - "tests/test_communication_edge_demo.py"
      - "scripts/run_communication_edge_demo.py"
      - "scripts/run_pinned_communication_source_integration.py"
      - "docs/COMMUNICATION_EDGE_SDK_DEMO.md"
      - "COMMUNICATION_EDGE_SDK_DEMO_MIRROR_HANDOFF.md"
      - ".github/workflows/communication-edge-demo-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK test requirements
        run: python -m pip install -e . pytest
      - name: Compile communication-edge demo
        run: python -m py_compile stegverse/communication_edge_demo.py stegverse/communication_edge_cli.py scripts/run_communication_edge_demo.py scripts/run_pinned_communication_source_integration.py tests/test_communication_edge_demo.py
      - name: Run communication-edge conformance tests
        run: python -m pytest tests/test_communication_edge_demo.py -q
      - name: Execute repository demonstration packet
        run: python scripts/run_communication_edge_demo.py examples/communication_edge_demo.json > /tmp/communication-edge-demo.json
      - name: Execute installed SDK command
        run: stegverse-comm-demo > /tmp/communication-edge-installed.json
      - name: Verify installed command matches repository demo and remains non-authorizing
        run: |
          python - <<'PY'
          import json
          repo=json.load(open('/tmp/communication-edge-demo.json'))
          installed=json.load(open('/tmp/communication-edge-installed.json'))
          assert installed == repo
          assert installed['sdk_simulation_only'] is True
          assert installed['authority_granted'] is False
          assert installed['execution_performed'] is False
          assert installed['selection']['selected_bearer'] == 'stegtalk-ip'
          assert installed['recovery_scenarios']['ambiguous_after_dispatch']['action'] == 'VERIFY_EXTERNALLY'
          assert installed['recovery_scenarios']['confirmed_pre_side_effect_failure']['action'] == 'TRY_FALLBACK'
          print(installed['demo_sha256'])
          PY
      - name: Note StegTalk runtime Python boundary
        if: matrix.python-version == '3.9'
        run: echo "SDK demo supports Python 3.9; current StegTalk runtime source declares Python >=3.11, so live-source ST-031/ST-032 proof is intentionally skipped on 3.9."
      - name: Checkout pinned current StegTalk source without credentials
        if: matrix.python-version != '3.9'
        run: |
          git clone --no-checkout https://github.com/StegVerse-Labs/StegTalk.git /tmp/StegTalk
          git -C /tmp/StegTalk checkout 72947c052467af2ba5850378dc53f7589c473d35
      - name: Checkout pinned KnowledgeVault runtime journal source without credentials
        if: matrix.python-version != '3.9'
        run: |
          git clone --no-checkout https://github.com/StegVerse-Labs/continuity-vault-kit.git /tmp/continuity-vault-kit
          git -C /tmp/continuity-vault-kit checkout 2f2070f94c26eed99ea87553f31579e60033eb1b
      - name: Execute pinned ST-031/ST-032 + native KV runtime journal proof
        if: matrix.python-version != '3.9'
        run: |
          python scripts/run_pinned_communication_source_integration.py \
            --stegtalk-repo /tmp/StegTalk \
            --kv-repo /tmp/continuity-vault-kit \
            > /tmp/pinned-source-integration.json
      - name: Verify pinned native KV runtime journal proof
        if: matrix.python-version != '3.9'
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/pinned-source-integration.json'))
          assert p['stegtalk_source_loaded'] is True
          assert p['stegtalk_st031_loaded'] is True
          assert p['stegtalk_st032_loaded'] is True
          assert p['knowledgevault_source_loaded'] is True
          assert p['knowledgevault_native_runtime_journal_loaded'] is True
          assert p['selected_bearer'] == 'stegtalk-ip'
          assert p['fallback_edge_id'] == 'source-integration:phone'
          assert p['edge_runtime_callable_executed'] is True
          assert p['edge_execution_outcome'] == 'DELIVERED'
          assert p['edge_duplicate_dispatch_suppressed'] is True
          assert p['kv_duplicate_execution_observation_suppressed'] is True
          assert p['ambiguous_action'] == 'VERIFY_EXTERNALLY'
          assert p['confirmed_failure_action'] == 'TRY_FALLBACK'
          assert p['kv_selection_reconstructed_after_restart'] is True
          assert p['kv_lease_reconstructed_after_restart'] is True
          assert p['kv_edge_execution_receipt_reconstructed_after_restart'] is True
          assert p['kv_recovery_decision_reconstructed_after_restart'] is True
          assert p['loopback_test_only'] is True
          assert p['physical_transport_proven'] is False
          assert p['production_activation_proven'] is False
          print(p['selection_sha256'])
          print(p['edge_execution_receipt_sha256'])
          PY
