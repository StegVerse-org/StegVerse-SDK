name: SDK Validation Diagnostic (Optional Hosted)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Run nonpersistent SDK validation diagnostic
        run: |
          set -eu
          cd /tmp/source
          python scripts/capture_sdk_validation_diagnostic.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/sdk-validation-diagnostic.json')
          if not p.is_file(): raise SystemExit('SDK_VALIDATION_DIAGNOSTIC_MISSING')
          report=json.loads(p.read_text())
          print('SDK validation status:', report.get('status'))
          raise SystemExit(0 if report.get('status')=='PASS' else 1)
          PY
          echo 'Diagnostic remains runner-local. GitHub Actions has no authority to persist or push evidence.'
