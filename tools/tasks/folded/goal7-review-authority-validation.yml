name: Goal 7 Review Authority Validation (Optional Hosted)

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Compile implementation and run standard-library contract checks
        run: |
          set -eu
          cd /tmp/source
          python -m compileall -q stegverse/review_authority.py
          python - <<'PY'
          from stegverse.review_authority import validate_review_manifest, build_acknowledgement_receipt
          manifest = {
            'schema_version':'1.0.0','artifact_id':'manifest-receipt-boundary','artifact_version':'0.3',
            'visibility_state':'PUBLICLY_VISIBLE','process_state':'REVIEW_ONLY','claim_authority':False,
            'publication_authority':False,'attribution_authority':False,'public_association_authority':False,
            'endorsement':'NONE','compatibility':'NONE','interoperability':'NONE',
            'external_references':[{'name':'GLM','association_status':'REFERENCE_ONLY'},{'name':'EVIDE','association_status':'REFERENCE_ONLY'}]
          }
          first=validate_review_manifest(manifest); second=validate_review_manifest(manifest)
          assert first['manifest_sha256']==second['manifest_sha256']
          a=build_acknowledgement_receipt(manifest,reviewer_id='reviewer-001')
          b=build_acknowledgement_receipt(manifest,reviewer_id='reviewer-001')
          assert a['receipt_sha256']==b['receipt_sha256']
          assert a['endorsement_granted'] is False and a['public_association_granted'] is False
          print('GOAL7_OPTIONAL_HOSTED_PASS')
          PY
          echo 'Full dependency-bearing tests remain locally executable and are not gated on this hosted runner.'
