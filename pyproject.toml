[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegverse-sdk"
version = '1.2.0'
description = "StegVerse SDK for governed AI testing, admissibility evaluation, receipt verification, and bounded routing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "StegVerse", email = "dev@stegverse.org"}
]
keywords = ["ai", "governance", "stegverse", "admissibility", "receipts", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.18",
    "black>=23.0",
    "mypy>=1.0",
]
governed-test = [
    "stegcore @ git+https://github.com/StegVerse-Labs/StegCore.git@124ea6b53ff79db8f514cacf1aab295f03cacf74",
    "stegverse-core-lite @ git+https://github.com/Data-Continuation/core-lite.git@72bdb0f110031ccc2cd98b8ebb7c22b1ab7326f8",
    "stegverse-master-records @ git+https://github.com/master-records/orchestration.git@3dae8832a167359612a15ccfde99a9f22b77fc8a",
]

[project.scripts]
stegverse = "stegverse.evaluator_console:main"
stegverse-portable = "stegverse.portable_packages:main"
stegverse-versions = "stegverse.release_index:main"
stegverse-mcp-test = "stegverse.mcp_cli:main"
stegverse-connect-llm = "stegverse.llm_connect_cli:main"
stegverse-output-proof = "stegverse.output_boundary_cli:main"
stegverse-comm-demo = "stegverse.communication_edge_cli:main"
stegverse-verify-governance = "stegverse.portable_governance_verifier_cli:main"
stegverse-governance-exchange = "stegverse.portable_governance_exchange_cli:main"

[project.urls]
Homepage = "https://github.com/StegVerse-org/StegVerse-SDK"
Documentation = "https://github.com/StegVerse-org/StegVerse-SDK/blob/main/docs/SDK_CONSOLE.md"
Repository = "https://github.com/StegVerse-org/StegVerse-SDK"
Issues = "https://github.com/StegVerse-org/StegVerse-SDK/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["stegverse*"]

[tool.setuptools.package-data]
"stegverse.demo_data" = ["*.json"]
