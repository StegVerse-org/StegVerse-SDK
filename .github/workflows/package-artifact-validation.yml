name: SDK Package Artifact Validation (Non-Authorizing)

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'setup.py'
      - 'stegverse/**'
      - 'tests/test_package_version_identity.py'
      - 'tests/test_pypi_trusted_publishing_contract.py'
      - 'tests/test_portable_governance_verifier.py'
      - 'tests/test_portable_governance_verifier_cli.py'
      - 'tests/test_portable_governance_exchange.py'
      - 'docs/PYPI_TRUSTED_PUBLISHING_MIRROR_HANDOFF.md'
      - 'docs/PORTABLE_GOVERNANCE_VERIFIER_MIRROR_HANDOFF.md'
      - 'docs/PORTABLE_GOVERNANCE_EVIDENCE_EXCHANGE_MIRROR_HANDOFF.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/package-artifact-validation.yml'
  workflow_dispatch:

permissions: {}

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Assert no release credential authority
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          echo 'PACKAGE_VALIDATION_CREDENTIAL_BOUNDARY_PASS'

      - name: Materialize exact public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1

      - name: Install build and inspection tooling
        run: |
          python -m pip install --disable-pip-version-check --no-input build wheel pytest

      - name: Validate Trusted Publisher authority contract
        run: |
          set -eu
          cd /tmp/source
          python -m unittest -v tests.test_pypi_trusted_publishing_contract

      - name: Validate portable governance verifier and exchange
        run: |
          set -eu
          cd /tmp/source
          python -m pytest -q \
            tests/test_portable_governance_verifier.py \
            tests/test_portable_governance_verifier_cli.py \
            tests/test_portable_governance_exchange.py

      - name: Build wheel and source distribution
        run: |
          set -eu
          cd /tmp/source
          python -m build
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify canonical wheel metadata from pyproject
        run: |
          set -eu
          cd /tmp/source
          python - <<'PY'
          import email
          import pathlib
          import tomllib
          import zipfile

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          expected_name = project['name']
          expected_version = project['version']
          expected_python = project['requires-python']
          expected_scripts = project.get('scripts', {})

          wheels = list(pathlib.Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'EXPECTED_ONE_WHEEL:{wheels!r}')
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(n for n in zf.namelist() if n.endswith('.dist-info/METADATA'))
              entry_name = next(n for n in zf.namelist() if n.endswith('.dist-info/entry_points.txt'))
              metadata = email.message_from_bytes(zf.read(metadata_name))
              entries = zf.read(entry_name).decode('utf-8')

          assert metadata['Name'] == expected_name, (metadata['Name'], expected_name)
          assert metadata['Version'] == expected_version, (metadata['Version'], expected_version)
          assert metadata['Requires-Python'] == expected_python, (metadata['Requires-Python'], expected_python)
          requires = metadata.get_all('Requires-Dist') or []
          required_fragments = ('requests>=2.28.0', 'pyyaml>=6.0', 'python-dotenv>=0.19.0')
          compact = [r.replace(' ', '') for r in requires]
          for expected in required_fragments:
              if not any(expected in r for r in compact):
                  raise SystemExit(f'MISSING_REQUIRES_DIST:{expected}:{requires!r}')
          for script, target in expected_scripts.items():
              expected = f'{script} = {target}'
              if expected not in entries:
                  raise SystemExit(f'MISSING_ENTRY_POINT:{expected}')
          print('SDK_WHEEL_METADATA_MATCHES_PYPROJECT_PASS', expected_version)
          PY

      - name: Verify legacy setuptools invocation resolves canonical metadata
        run: |
          set -eu
          cd /tmp/source
          expected_name="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])
          PY
          )"
          expected_version="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$(python setup.py --name)" = "$expected_name"
          test "$(python setup.py --version)" = "$expected_version"
          echo 'SETUP_PY_CANONICAL_METADATA_PASS'

      - name: Install exact wheel into isolated environment and smoke test
        run: |
          set -eu
          cd /tmp/source
          expected_version="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          python -m venv /tmp/sdk-wheel-venv
          /tmp/sdk-wheel-venv/bin/python -m pip install --disable-pip-version-check --no-input dist/*.whl
          /tmp/sdk-wheel-venv/bin/python - <<'PY' "$expected_version"
          import importlib.metadata
          import sys
          import stegverse
          assert importlib.metadata.version('stegverse-sdk') == sys.argv[1]
          print('SDK_WHEEL_IMPORT_PASS', sys.argv[1])
          PY
          /tmp/sdk-wheel-venv/bin/stegverse --help >/tmp/stegverse-help.txt
          test -s /tmp/stegverse-help.txt
          /tmp/sdk-wheel-venv/bin/stegverse-verify-governance --help >/tmp/stegverse-verify-help.txt
          test -s /tmp/stegverse-verify-help.txt
          /tmp/sdk-wheel-venv/bin/stegverse-governance-exchange --help >/tmp/stegverse-exchange-help.txt
          test -s /tmp/stegverse-exchange-help.txt
          echo 'SDK_WHEEL_CONSOLE_SMOKE_PASS'

      - name: Record non-authorizing boundary
        run: |
          echo 'PACKAGE_ARTIFACT_VALIDATION_PASS'
          echo 'This workflow validates source-built artifacts only.'
          echo 'It cannot tag, publish, create a release, push repository state, request OIDC, or receive TV/TVC credentials.'
