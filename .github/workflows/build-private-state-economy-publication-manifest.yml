name: Exact Private-State Economy Publication Manifest

on:
  pull_request:
    paths:
      - scripts/build_private_state_economy_publication_manifest.py
      - tests/test_private_state_economy_publication_manifest.py
      - .github/workflows/build-private-state-economy-publication-manifest.yml
  workflow_dispatch:

jobs:
  build-and-attempt-exact-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run negative/source identity tests
        run: python3 -m unittest discover -s tests -p test_private_state_economy_publication_manifest.py -v
      - name: Fetch immutable approved Publisher source
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/GCAT-BCAT-Engine/Publisher/f9a140d02e162c8284db7fe22b9093e70c25207a/papers/StegVerse_Private_State_Economy_White_Paper_v0.1.md \
            --output /tmp/private-state-economy-v0.1.md
          printf '%s  %s\n' \
            3329a0c47161eb4613c32bbc5e0a393116f395cb8fa78368ed21fed8775c3dca \
            /tmp/private-state-economy-v0.1.md | sha256sum --check -
      - name: Build exact manifest and universal runtime request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/economic-publication-manifest
          PYTHONPATH=. python3 scripts/build_private_state_economy_publication_manifest.py \
            --source /tmp/private-state-economy-v0.1.md \
            --manifest-output /tmp/economic-publication-manifest/manifest.json \
            --request-output /tmp/economic-publication-manifest/execution-request.json \
            | tee /tmp/economic-publication-manifest/source-build-receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/economic-publication-manifest')
          receipt=json.loads((root/'source-build-receipt.json').read_text())
          assert receipt['state']=='EXACT_MANIFEST_PREPARED_SOURCE_ONLY'
          assert receipt['runtime_invoked'] is False
          assert receipt['authority_effect']=='NONE_SOURCE_ONLY'
          request=json.loads((root/'execution-request.json').read_text())
          assert request['canonical_manifest_sha256']=='ba615d6e487f11853173154317782fad1ed83dec32ab0c18650703e063fcc9e3'
          assert request['request_sha256']=='11db25adc816acb91d806bfbd6a0060859eba4d8898dbd488bf4526eb97f65be'
          PY
      - name: Attempt exact manifest through public run-manifest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m stegverse.manifest_execution \
            --manifest /tmp/economic-publication-manifest/manifest.json \
            --output /tmp/economic-publication-manifest/first-disposition.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/economic-publication-manifest')
          result=json.loads((root/'first-disposition.json').read_text())
          assert result['schema']=='stegverse.sdk.manifest-transition-handoff/v1'
          assert result['disposition']=='ALLOW'
          assert result['evaluation_boundary']=='SDK_MANIFEST_HANDOFF'
          assert result['destination_resolution_source']=='MANIFEST_COMPLETION_EGRESS'
          assert result['destination_resolution_environment_inputs']==[]
          assert result['receiver_contacted'] is False
          assert result['awaits_external_machine'] is False
          assert result['consequence_committed'] is False
          assert result['intr_admission_observed'] is False
          assert result['far_side_transition_observed'] is False
          assert result['organization_receipt_observed'] is False
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Upload exact manifest and first handoff disposition
        uses: actions/upload-artifact@v4
        with:
          name: private-state-economy-publication-manifest-first-disposition
          path: /tmp/economic-publication-manifest/
          if-no-files-found: error
