name: External Collaboration Authentic Runtime Proof Contract Validation

on:
  pull_request:
    paths:
      - 'docs/EXTERNAL_COLLAB_AUTHENTIC_RUNTIME_PROOF_CONTRACT.md'
      - 'scripts/check_external_collab_authentic_runtime_proof_contract.py'
      - '.github/workflows/external-collab-authentic-runtime-proof-contract-validation.yml'
      - 'SDK_GENERIC_MANIFEST_DOWNSTREAM_PROPAGATION_MIRROR_HANDOFF.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/check_external_collab_authentic_runtime_proof_contract.py
