name: SDK Four-Stage Manifest-Only Experiment
# Frozen-head experiment: manifests are the only per-test variable input.
# Frozen SDK source commit: captured at runtime in /tmp/sdk-frozen-head.txt

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'VERSION.json'
      - 'PRODUCTION_RELEASE_SET_MIRROR_HANDOFF.md'
      - 'stegverse/purpose_bound_worker_processor.py'
      - 'stegverse/atomic_task_worker_processor.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/manifest_execution.py'
      - 'stegverse/route_resolution.py'
      - 'inspection/examples/sdk-tt-shared-source.json'
      - 'inspection/examples/sdk-test1-purpose-worker.processor-request.json'
      - 'inspection/examples/sdk-test2-atomic-task-worker.processor-request.json'
      - 'inspection/examples/sdk-test3-invariance-seam.processor-request.json'
      - '.github/workflows/tt-atomic-task-worker-binding.yml'
  workflow_dispatch:

jobs:
  manifest-only-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze exact SDK source identity
        run: |
          git rev-parse HEAD | tee /tmp/sdk-frozen-head.txt
          git status --porcelain --untracked-files=all | tee /tmp/sdk-before.status
          test ! -s /tmp/sdk-before.status
          git ls-files -s | LC_ALL=C sort > /tmp/sdk-source-index.txt
          sha256sum /tmp/sdk-source-index.txt | tee /tmp/sdk-source-index.sha256
          python - <<'PY'
          import json, pathlib, subprocess
          sha = pathlib.Path('/tmp/sdk-frozen-head.txt').read_text().strip()
          version = json.loads(pathlib.Path('VERSION.json').read_text()) if pathlib.Path('VERSION.json').exists() else {}
          pathlib.Path('/tmp/experiment-metadata.json').write_text(json.dumps({
              'schema':'stegverse.sdk.four-stage-manifest-experiment.v2',
              'sdk_commit':sha,
              'sdk_version':version,
              'per_stage_variable_execution_input':'manifest_only',
              'test3_semantics':'same installed atomic-task-worker processor; distinct manifested identity and preregistered proposition; intended invariance/person-neutrality test',
              'task4_overlap_semantics':'overlap of measured local invocation intervals after both group barriers with an explicit 10ms observation dwell; serialized invocation control must falsify overlap; this does not claim CPU-parallel instruction execution',
              'worker_route_surface':'SDK_LOCAL_SEMANTIC_DEMONSTRATION',
              'historical_preregistration_anchor':'StegVerse-Labs/.github@0127082e415fb220c709962ab7d0645e06105a4c',
              'historical_preregistration_sha256':'37363e0d3d8880956b0e97a90c54a140e6bebfac0aa9be73a5fb90ab2effa5d7',
              'historical_run_35547155843_attempt1_disposition':'SUCCESS'
          }, sort_keys=True, indent=2) + '\n')
          PY

      - run: |
          python -m pip install -e '.[dev]'
          python -m pip freeze | LC_ALL=C sort > /tmp/pip-freeze.txt
          : > /tmp/experiment-stage-results.log

      - name: Materialize Task 4 generic group processor request
        run: |
          cat > /tmp/sdk-task4-group.processor-request.json <<'JSON'
          {
            "schema": "stegverse.sdk.purpose-bound-worker-group-test.v1",
            "test_id": "SDK-TASK4-THREE-WORKER-CONCURRENT-001",
            "purpose": "Partition one bounded manifested task across three concurrent purpose-bound workers and return only records after all workers retire.",
            "required_capability": "text.integrity_summary",
            "worker_count": 3,
            "partition_ids": ["A", "B", "C"],
            "group_wall_clock_budget_seconds": 30,
            "per_worker_lifetime_policy": {
              "mode": "DERIVED_COST_TASK_DELAY_BUDGET",
              "production_recompute_required": true,
              "decomposition_target": "RECORDS_ENABLED_PACKET",
              "retirement_condition": "PURPOSE_COMPLETED_OR_FAILED_OR_BUDGET_EXHAUSTED",
              "cost_analysis": {
                "expected_compute_units": 3,
                "external_cost_usd_ceiling": 0,
                "task_cost_basis": "one deterministic partition of a three-worker bounded manifested task"
              },
              "time_budget_seconds": {
                "expected_task_execution": 6,
                "known_delay": 4,
                "inferred_unknown_delay_reserve": 8,
                "records_decomposition": 7,
                "safety_reserve": 5
              },
              "derived_max_lifetime_seconds": 30,
              "unknown_delay_inference_basis": "bounded reserve for local scheduling, processing, and records decomposition"
            },
            "expected_evidence_fields": [
              "worker_count_matches_manifest",
              "distinct_worker_identities",
              "overlap_measurement_available",
              "partition_reconstruction_exact",
              "all_workers_records_only",
              "all_workers_retired",
              "continued_authority_false",
              "group_result_binding"
            ]
          }
          JSON

      - name: Build all four manifests before execution
        run: |
          stegverse manifest build \
            --input inspection/examples/sdk-tt-shared-source.json \
            --processor-request inspection/examples/sdk-test1-purpose-worker.processor-request.json \
            --source-framework external_evaluator --source-output-id test-1 \
            --process purpose_bound_worker --return-depth full-trace \
            --created-at 2026-09-20T21:45:00Z --output /tmp/test1.manifest.json

          stegverse manifest build \
            --input inspection/examples/sdk-tt-shared-source.json \
            --processor-request inspection/examples/sdk-test2-atomic-task-worker.processor-request.json \
            --source-framework external_evaluator --source-output-id test-2 \
            --process atomic_task_worker --return-depth full-trace \
            --created-at 2026-09-20T21:46:00Z --output /tmp/test2.manifest.json

          stegverse manifest build \
            --input inspection/examples/sdk-tt-shared-source.json \
            --processor-request inspection/examples/sdk-test3-invariance-seam.processor-request.json \
            --source-framework external_evaluator --source-output-id test-3 \
            --process atomic_task_worker --return-depth full-trace \
            --created-at 2026-09-20T21:47:00Z --output /tmp/test3.manifest.json

          stegverse manifest build \
            --input inspection/examples/sdk-tt-shared-source.json \
            --processor-request /tmp/sdk-task4-group.processor-request.json \
            --source-framework external_evaluator --source-output-id task-4 \
            --process purpose_bound_worker --return-depth full-trace \
            --created-at 2026-09-20T21:48:00Z --output /tmp/task4.manifest.json

      - name: Execute Test 1 from manifest only
        run: |
          stegverse run-manifest --manifest /tmp/test1.manifest.json --output /tmp/test1.result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/test1.result.json'))
          assert r['schema'] == 'stegverse.sdk.manifest-attachment-disposition/v1'
          assert r['disposition'] == 'FAIL_CLOSED'
          assert r['evaluation_boundary'] == 'SDK_MANIFEST_TRANSPORT_ATTACHMENT'
          assert r['failed_predicate'] == 'UNIVERSAL_INTR_INGRESS_NOT_CONFIGURED'
          print('MANIFEST_ONLY_TEST1_GOVERNED_ATTACHMENT_BOUNDARY_PASS')
          PY

      - name: Execute Test 2 from manifest only
        run: |
          stegverse run-manifest --manifest /tmp/test2.manifest.json --output /tmp/test2.result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/test2.result.json'))
          assert r['schema'] == 'stegverse.sdk.manifest-attachment-disposition/v1'
          assert r['disposition'] == 'FAIL_CLOSED'
          assert r['evaluation_boundary'] == 'SDK_MANIFEST_TRANSPORT_ATTACHMENT'
          assert r['failed_predicate'] == 'UNIVERSAL_INTR_INGRESS_NOT_CONFIGURED'
          print('MANIFEST_ONLY_TEST2_GOVERNED_ATTACHMENT_BOUNDARY_PASS')
          PY

      - name: Execute Test 3 from manifest only
        run: |
          stegverse run-manifest --manifest /tmp/test3.manifest.json --output /tmp/test3.result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/test3.result.json'))
          assert r['schema'] == 'stegverse.sdk.manifest-attachment-disposition/v1'
          assert r['disposition'] == 'FAIL_CLOSED'
          assert r['evaluation_boundary'] == 'SDK_MANIFEST_TRANSPORT_ATTACHMENT'
          assert r['failed_predicate'] == 'UNIVERSAL_INTR_INGRESS_NOT_CONFIGURED'
          print('MANIFEST_ONLY_TEST3_GOVERNED_ATTACHMENT_BOUNDARY_PASS')
          PY

      - name: Execute Task 4 from manifest only
        run: |
          stegverse run-manifest --manifest /tmp/task4.manifest.json --output /tmp/task4.result.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/task4.result.json'))
          assert r['schema'] == 'stegverse.sdk.manifest-attachment-disposition/v1'
          assert r['disposition'] == 'FAIL_CLOSED'
          assert r['evaluation_boundary'] == 'SDK_MANIFEST_TRANSPORT_ATTACHMENT'
          assert r['failed_predicate'] == 'UNIVERSAL_INTR_INGRESS_NOT_CONFIGURED'
          print('MANIFEST_ONLY_TASK4_GOVERNED_ATTACHMENT_BOUNDARY_PASS')
          PY

      - name: Verify all four manifests reached the same governed attachment boundary
        run: |
          python - <<'PY' | tee -a /tmp/experiment-stage-results.log
          import json
          for path in ['/tmp/test1.result.json','/tmp/test2.result.json','/tmp/test3.result.json','/tmp/task4.result.json']:
              r=json.load(open(path))
              assert r['schema']=='stegverse.sdk.manifest-attachment-disposition/v1'
              assert r['disposition']=='FAIL_CLOSED'
              assert r['failed_predicate']=='UNIVERSAL_INTR_INGRESS_NOT_CONFIGURED'
          print('FOUR_STAGE_GENERIC_GOVERNED_BOUNDARY_PASS')
          PY

      - name: Prove SDK source remained unchanged throughout experiment
        run: |
          git rev-parse HEAD | tee /tmp/sdk-after-head.txt
          diff -u /tmp/sdk-frozen-head.txt /tmp/sdk-after-head.txt
          git status --porcelain --untracked-files=all | tee /tmp/sdk-after.status
          test ! -s /tmp/sdk-after.status
          git ls-files -s | LC_ALL=C sort > /tmp/sdk-source-index.after.txt
          diff -u /tmp/sdk-source-index.txt /tmp/sdk-source-index.after.txt
          sha256sum /tmp/test1.manifest.json /tmp/test2.manifest.json /tmp/test3.manifest.json /tmp/task4.manifest.json \
            /tmp/test1.result.json /tmp/test2.result.json /tmp/test3.result.json /tmp/task4.result.json \
            /tmp/sdk-source-index.txt /tmp/experiment-metadata.json /tmp/sdk-task4-group.processor-request.json \
            /tmp/pip-freeze.txt /tmp/experiment-stage-results.log \
            | tee /tmp/experiment-sha256.txt

      - name: Retain complete four-stage experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdk-four-stage-manifest-only-experiment
          path: |
            /tmp/sdk-frozen-head.txt
            /tmp/sdk-source-index.txt
            /tmp/sdk-source-index.sha256
            /tmp/experiment-metadata.json
            /tmp/pip-freeze.txt
            /tmp/experiment-stage-results.log
            /tmp/sdk-task4-group.processor-request.json
            /tmp/test1.manifest.json
            /tmp/test2.manifest.json
            /tmp/test3.manifest.json
            /tmp/task4.manifest.json
            /tmp/test1.result.json
            /tmp/test2.result.json
            /tmp/test3.result.json
            /tmp/task4.result.json
            /tmp/experiment-sha256.txt
