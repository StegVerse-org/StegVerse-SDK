name: Evaluator Manifest Source Validation (Non-Authorizing)

on:
  push:
    branches: [main]
    paths:
      - inspection/request.schema.json
      - inspection/examples/governed-test-request.json
      - stegverse/public_inspection.py
      - stegverse/sovereign_validation_runtime.py
      - stegverse/route_resolution.py
      - stegverse/governance_navigation.py
      - stegverse/governance_ingress_runtime.py
      - stegverse/governance_ingress_cli.py
      - stegverse/cli.py
      - stegverse/evaluation_boundary_verifier.py
      - scripts/validate_public_inspection_request.py
      - scripts/build_evaluation_boundary_artifact_manifest.py
      - scripts/build_evaluation_boundary_owner_packet.py
      - tests/test_public_inspection_request.py
      - tests/test_public_inspection_governed_binding.py
      - tests/test_governance_ingress_runtime.py
      - tests/test_route_resolution.py
      - tests/test_cli_preformatted_manifest.py
      - tests/test_evaluation_boundary_contract.py
      - tests/test_evaluation_boundary_owner_packet.py
      - EVALUATOR_MANIFEST_NON_INTERFERENCE_MIRROR_HANDOFF.md
      - PRODUCTION_RELEASE_SET_MIRROR_HANDOFF.md
      - docs/ODA3_EVALUATION_BOUNDARY_TEST_PLAN.md
      - README.md
      - docs/SDK_CONSOLE.md
      - .github/workflows/evaluator-manifest-source-validation.yml
  pull_request:
    branches: [main]
    paths:
      - inspection/request.schema.json
      - inspection/examples/governed-test-request.json
      - stegverse/public_inspection.py
      - stegverse/sovereign_validation_runtime.py
      - stegverse/route_resolution.py
      - stegverse/governance_navigation.py
      - stegverse/governance_ingress_runtime.py
      - stegverse/governance_ingress_cli.py
      - stegverse/cli.py
      - stegverse/evaluation_boundary_verifier.py
      - scripts/validate_public_inspection_request.py
      - scripts/build_evaluation_boundary_artifact_manifest.py
      - scripts/build_evaluation_boundary_owner_packet.py
      - tests/test_public_inspection_request.py
      - tests/test_public_inspection_governed_binding.py
      - tests/test_governance_ingress_runtime.py
      - tests/test_route_resolution.py
      - tests/test_cli_preformatted_manifest.py
      - tests/test_evaluation_boundary_contract.py
      - tests/test_evaluation_boundary_owner_packet.py
      - EVALUATOR_MANIFEST_NON_INTERFERENCE_MIRROR_HANDOFF.md
      - PRODUCTION_RELEASE_SET_MIRROR_HANDOFF.md
      - docs/ODA3_EVALUATION_BOUNDARY_TEST_PLAN.md
      - README.md
      - docs/SDK_CONSOLE.md
      - .github/workflows/evaluator-manifest-source-validation.yml
  workflow_dispatch:

permissions: {}

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Validate public inspection and generic manifest ingress
        run: |
          set -eu
          cd /tmp/source
          python scripts/validate_public_inspection_request.py inspection/examples/example-request.json
          python scripts/validate_public_inspection_request.py inspection/examples/governed-test-request.json
          python -m unittest tests.test_public_inspection_request
          python -m unittest tests.test_public_inspection_governed_binding
          python -m unittest tests.test_governance_ingress_runtime
          python -m unittest tests.test_route_resolution
          python -m unittest tests.test_cli_preformatted_manifest
          python -m unittest tests.test_evaluation_boundary_contract
          python -m unittest tests.test_evaluation_boundary_owner_packet
      - name: Compile evaluator-boundary and ingress modules
        run: |
          set -eu
          cd /tmp/source
          python -m py_compile \
            stegverse/public_inspection.py \
            stegverse/sovereign_validation_runtime.py \
            stegverse/route_resolution.py \
            stegverse/governance_navigation.py \
            stegverse/governance_ingress_runtime.py \
            stegverse/governance_ingress_cli.py \
            stegverse/cli.py \
            stegverse/evaluation_boundary_verifier.py \
            scripts/validate_public_inspection_request.py \
            scripts/build_evaluation_boundary_artifact_manifest.py \
            scripts/build_evaluation_boundary_owner_packet.py
      - name: Build exact-commit artifact manifest
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          cd /tmp/source
          python scripts/build_evaluation_boundary_artifact_manifest.py \
            --archive-source \
            --source-commit "${SOURCE_SHA}" \
            --source-branch "${SOURCE_REF}" \
            --output /tmp/evaluation-boundary-artifacts.json
          cat /tmp/evaluation-boundary-artifacts.json
      - name: Record source-only boundary
        run: |
          echo 'EVALUATOR_MANIFEST_SOURCE_VALIDATION_PASS'
          echo 'This job validates source/schema/binding behavior and owner-packet completeness tooling, and emits an exact-commit file-hash manifest only; it grants no runtime, release, custody, signing, or evaluator authority.'
