name: Test 5 StegBrowser Manifest Validation
on:
  push:
    branches: ["test5-stegbrowser-llm-profile-route"]
  pull_request:
    paths:
      - "stegverse/stegbrowser_processor.py"
      - "stegverse/manifest_builder.py"
      - "stegverse/route_resolution.py"
      - "stegverse/manifest_execution.py"
      - "stegverse/manifest_state_transition_runtime.py"
      - "tests/test_stegbrowser_manifest_profile.py"
      - ".github/workflows/test5-stegbrowser-manifest-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_stegbrowser_manifest_profile.py
