name: Test 5 StegBrowser Manifest Validation
on:
  push:
    branches: ["test5-stegbrowser-llm-profile-route"]
  pull_request:
    paths:
      - "stegverse/stegbrowser_processor.py"
      - "stegverse/manifest_builder.py"
      - "stegverse/route_resolution.py"
      - "stegverse/manifest_execution.py"
      - "stegverse/manifest_state_transition_runtime.py"
      - "tests/test_stegbrowser_manifest_profile.py"
      - ".github/workflows/test5-stegbrowser-manifest-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
env:
  # Exact transitive install set (constraints/sdk-install.txt, SDK#484 V-P5).
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_stegbrowser_manifest_profile.py
