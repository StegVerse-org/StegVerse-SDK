name: Goal 7 Review Authority Validation

on:
  push:
    branches:
      - validation/goal7-completion
  pull_request:
    branches: [main]
    paths:
      - 'stegverse/review_authority.py'
      - 'tests/test_review_authority.py'
      - 'schemas/review_authority_manifest.schema.json'
      - '.github/workflows/goal7-review-authority-validation.yml'
      - 'validation/goal7_completion_request.json'
  workflow_dispatch:

concurrency:
  group: goal7-review-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused validation dependencies
        run: python -m pip install pytest jsonschema
      - name: Compile implementation
        run: python -m compileall -q stegverse/review_authority.py
      - name: Run Goal 7 repository tests
        run: python -m pytest tests/test_review_authority.py -v
      - name: Validate schema and deterministic receipts
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from stegverse.review_authority import validate_review_manifest, build_acknowledgement_receipt

          with open('schemas/review_authority_manifest.schema.json', encoding='utf-8') as handle:
              schema = json.load(handle)
          Draft202012Validator.check_schema(schema)

          manifest = {
              'schema_version': '1.0.0',
              'artifact_id': 'manifest-receipt-boundary',
              'artifact_version': '0.3',
              'visibility_state': 'PUBLICLY_VISIBLE',
              'process_state': 'REVIEW_ONLY',
              'claim_authority': False,
              'publication_authority': False,
              'attribution_authority': False,
              'public_association_authority': False,
              'endorsement': 'NONE',
              'compatibility': 'NONE',
              'interoperability': 'NONE',
              'external_references': [
                  {'name': 'GLM', 'association_status': 'REFERENCE_ONLY'},
                  {'name': 'EVIDE', 'association_status': 'REFERENCE_ONLY'},
              ],
          }
          first = validate_review_manifest(manifest)
          second = validate_review_manifest(manifest)
          assert first['manifest_sha256'] == second['manifest_sha256']
          receipt_a = build_acknowledgement_receipt(manifest, reviewer_id='reviewer-001')
          receipt_b = build_acknowledgement_receipt(manifest, reviewer_id='reviewer-001')
          assert receipt_a['receipt_sha256'] == receipt_b['receipt_sha256']
          assert receipt_a['endorsement_granted'] is False
          assert receipt_a['public_association_granted'] is False
          print('Goal 7 deterministic governance validation: PASS')
          PY
