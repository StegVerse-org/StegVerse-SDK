name: TVC Boundary Validation

on:
  workflow_call:
    inputs:
      secret_type:
        description: 'Capability class to validate; no secret is issued here'
        required: true
        type: string
      ttl_seconds:
        description: 'Requested TTL for boundary validation only'
        required: false
        type: number
        default: 600
      repo_context:
        description: 'Repository context for boundary validation only'
        required: false
        type: string
        default: ${{ github.repository }}
    outputs:
      secret_value:
        description: 'Always empty; secrets never transit GitHub Actions'
        value: ''
      expiry:
        description: 'Always empty; no token is issued'
        value: ''
      token_id:
        description: 'Always empty; no token is issued'
        value: ''

permissions: {}

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Prove hosted runner is not a TV/TVC secret carrier
        env:
          REQUESTED_SECRET_TYPE: ${{ inputs.secret_type }}
          REQUESTED_TTL: ${{ inputs.ttl_seconds }}
          REQUESTED_REPO_CONTEXT: ${{ inputs.repo_context }}
        run: |
          set -eu
          test -n "$REQUESTED_SECRET_TYPE"
          test "$REQUESTED_TTL" -gt 0
          test -n "$REQUESTED_REPO_CONTEXT"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${TV_IDENTITY_KEY:-}"
          test -z "${TVC_SECRET:-}"
          echo 'TVC_HOSTED_SECRET_TRANSPORT_DISABLED'
          echo 'TV/TVC credentials and capability material must remain inside the sovereign/local TV/TVC boundary and may not be issued through GitHub Actions, workflow secrets, OIDC, or workflow outputs.'
