name: SDK Structured Authority Basis Validation

on:
  pull_request:
    paths:
      - "stegverse/authority_basis_bridge.py"
      - "stegverse/evaluator_manifest_builder.py"
      - "tests/test_evaluator_authority_basis_bridge.py"
      - "README.md"
      - "SDK_EVALUATOR_GOVERNANCE_POSTURE_MANIFEST_MIRROR_HANDOFF.md"
      - ".github/workflows/sdk-structured-authority-basis.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact transitive install set (constraints/sdk-install.txt, SDK#484 V-P5).
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install SDK source
        run: python -m pip install -e . pytest
      - name: Run structured authority bridge tests
        run: python -m pytest -q tests/test_evaluator_authority_basis_bridge.py tests/test_evaluator_manifest_builder.py
      - name: Compile authority bridge
        run: python -m py_compile stegverse/authority_basis_bridge.py stegverse/evaluator_manifest_builder.py
