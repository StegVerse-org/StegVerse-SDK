name: System Boundary Evidence Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_system_boundary_evidence.py'
      - 'stegverse/system_boundary_activation.py'
      - 'stegverse/system_boundary_downstream_status.py'
      - 'stegverse/system_boundary_workflow_evidence.py'
      - 'tests/test_sync_system_boundary_evidence.py'
      - '.github/workflows/system-boundary-evidence-sync.yml'

permissions: {}

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - name: Prove hosted evidence lane is non-authorizing
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          echo 'SYSTEM_BOUNDARY_EVIDENCE_HOSTED_MUTATION_DISABLED'
          echo 'Canonical evidence synchronization belongs to sovereign/local repository tooling. GitHub Actions may not fetch authenticated workflow evidence, commit evidence, or push repository state.'
