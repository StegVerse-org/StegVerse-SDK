name: MIR Leaf v3 Conformance Validation

on:
  pull_request:
    paths:
      - 'fixtures/mir_leaf_v3_conformance_fixture_v1.json'
      - 'fixtures/mir_leaf_v3_conformance_expected_result_v1.json'
      - 'stegverse/mir_leaf_v3.py'
      - 'tools/mir_leaf_v3_neutral_reproducer.mjs'
      - 'tools/compare_mir_leaf_v3_result.py'
      - 'tests/test_mir_leaf_v3_conformance.py'
      - 'tests/test_compare_mir_leaf_v3_result.py'
      - 'docs/MIR_LEAF_V3_CONFORMANCE_FIXTURE_MIRROR_HANDOFF.md'
      - '.github/workflows/mir-leaf-v3-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Exact transitive install set (constraints/sdk-install.txt, SDK#484 V-P5).
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install SDK dependencies
        run: python -m pip install -e .
      - name: Run conformance and counterpart-comparison tests
        run: python -m unittest tests.test_mir_leaf_v3_conformance tests.test_compare_mir_leaf_v3_result
      - name: Emit neutral result
        run: node tools/mir_leaf_v3_neutral_reproducer.mjs fixtures/mir_leaf_v3_conformance_fixture_v1.json > /tmp/neutral-result.json
      - name: Compare neutral result to frozen expected vector
        run: python tools/compare_mir_leaf_v3_result.py /tmp/neutral-result.json
