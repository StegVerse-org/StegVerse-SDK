name: ELAN Local SDK Governance Experiment

on:
  pull_request:
    paths:
      - 'scripts/run_elan_manifest_governance_evidence_test.py'
      - 'scripts/run_elan_observed_silence_governance_test.py'
      - 'scripts/run_compiled_state_governance_matrix_test.py'
      - 'stegverse/local_governance_boundary.py'
      - 'stegverse/local_governance_experiment.py'
      - 'stegverse/public_inspection.py'
      - 'tests/test_local_governance_boundary.py'
      - 'SDK_COMPILED_STATE_GOVERNANCE_MATRIX_MIRROR_HANDOFF.md'
      - '.github/workflows/elan-governance-evidence-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-governance-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current SDK source only
        run: python -m pip install -e . pytest
      - name: Run focused local SDK boundary tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_local_governance_boundary.py tests/test_intr_posture_runtime_bridge.py tests/test_evaluator_manifest_builder.py
      - name: Run baseline ELAN local SDK governance experiment
        env:
          PYTHONPATH: .
        run: python scripts/run_elan_manifest_governance_evidence_test.py
      - name: Assert baseline missing-input evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('evidence/elan/2026-09-10-governance-test/15-summary.json').read_text())
          assert s['governance_state'] == 'DENY'
          assert s['governance_reason'] == 'signal.inputs_incomplete'
          assert s['executor_invoked'] is False
          assert s['result_returned'] is True
          PY
      - name: Run observed-silence ELAN local SDK governance experiment
        env:
          PYTHONPATH: .
        run: python scripts/run_elan_observed_silence_governance_test.py
      - name: Assert observed silence is admitted as state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('evidence/elan/2026-09-11-observed-silence-test/14-summary.json').read_text())
          assert s['event_3_representation'] == 'OBSERVABLE_NON_EMISSION_STATE_TRANSITION'
          assert s['event_3_in_missing_inputs'] is False
          assert s['governance_state'] == 'ALLOW'
          assert s['governance_reason'] == 'ok'
          assert s['result_returned'] is True
          PY
      - name: Run compiled-state Event 3 matrix
        env:
          PYTHONPATH: .
        run: python scripts/run_compiled_state_governance_matrix_test.py
      - name: Assert Event 3 is transition from Event 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('evidence/elan/2026-09-11-compiled-state-governance-matrix/03-summary.json').read_text())
          no_signal=s['no_signal']
          silence=s['observed_silence']
          assert s['upstream_parameters_reinterpreted'] is False
          assert no_signal['event_3']['predecessor_event'] == 2
          assert no_signal['missing_inputs'] == ['event_3:no_signal']
          assert no_signal['governance_state'] == 'DENY'
          assert no_signal['governance_reason'] == 'signal.inputs_incomplete'
          assert silence['event_3']['predecessor_event'] == 2
          assert silence['event_3']['state_transition']['from_event'] == 2
          assert silence['event_3']['state_transition']['to'] == 'NON_EMISSION_OBSERVED'
          assert silence['event_3']['state_transition']['trigger'] == 'OBSERVATION_WINDOW_CLOSED_WITHOUT_EMISSION'
          assert silence['missing_inputs'] == []
          assert silence['governance_state'] == 'ALLOW'
          assert silence['governance_reason'] == 'ok'
          PY
      - name: Inventory evidence artifacts
        run: |
          find evidence/elan/2026-09-10-governance-test -maxdepth 1 -type f -print -exec sha256sum {} \;
          find evidence/elan/2026-09-11-observed-silence-test -maxdepth 1 -type f -print -exec sha256sum {} \;
          find evidence/elan/2026-09-11-compiled-state-governance-matrix -maxdepth 1 -type f -print -exec sha256sum {} \;
      - name: Upload compiled-state matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiled-state-governance-matrix
          path: evidence/elan/2026-09-11-compiled-state-governance-matrix/
          if-no-files-found: error
