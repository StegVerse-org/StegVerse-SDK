name: SDK v1.3.0 release transition disposition

# Release and credential authority is TV/TVC; GitHub Actions holds no runtime or
# release authority (StegVerse-Labs/.github TASK_REGISTRY_CANONICAL_INVARIANTS.md,
# data/task-registry-global-invariants.json). This workflow previously created the
# v1.3.0 tag and GitHub Release with the workflow's GitHub token. It now records
# the registered non-ALLOW disposition for the requested transition and commits
# no consequence.

on:
  push:
    branches: [main]
    paths:
      - ".github/release-requests/v1.3.0.json"

permissions: {}

jobs:
  disposition:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record FAIL_CLOSED release-transition disposition
        run: |
          cat <<'EOF'
          attempted_transition: StegVerse SDK v1.3.0 tag/release at b1376d3e3e3c79b6e996d32766bfd7e41cd0ccc4
          disposition: FAIL_CLOSED
          failure_code: GITHUB_ACTIONS_TOKEN_IS_NOT_RELEASE_AUTHORITY
          failed_predicate: TV/TVC GRANTED release authorization bound to the exact commit
          required_evidence_or_repair: a TV/TVC GRANTED release authorization bound to the exact commit, and published Requires-Dist with no direct URL references
          retry_entrypoint: .github/release-requests/v1.3.0.json, evaluated by the TV/TVC-owned release transition
          failure_codes:
            - GITHUB_ACTIONS_TOKEN_IS_NOT_RELEASE_AUTHORITY
            - DIRECT_REFERENCE_DEPENDENCIES_UNPUBLISHABLE
          failed_predicates:
            - TV/TVC GRANTED release authorization bound to the exact commit
            - published Requires-Dist contains no direct URL references
          owning_existing_goal: StegVerse-org/StegVerse-SDK#165
          next_attempt: TV/TVC-owned release transition for a candidate whose published metadata is index-installable
          consequence_committed: false
          EOF
          exit 1
