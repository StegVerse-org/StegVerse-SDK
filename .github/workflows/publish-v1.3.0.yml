name: Create SDK v1.3.0 tag and release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-requests/v1.3.0.json"

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v1.3.0 tag and GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "v1.3.0";
            const sha = "b1376d3e3e3c79b6e996d32766bfd7e41cd0ccc4";

            try {
              const existing = await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag });
              if (existing.data.object.sha !== sha) {
                core.setFailed("FAIL_CLOSED: existing tag points to " + existing.data.object.sha + ", expected " + sha);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: "refs/tags/" + tag, sha });
            }

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: sha,
                name: "StegVerse SDK v1.3.0",
                body: "StegVerse SDK v1.3.0 release from the frozen validated candidate.",
                draft: false,
                prerelease: false
              });
            }

            core.info("TAG_AND_RELEASE_ALLOW tag=" + tag + " commit=" + sha + " release=" + release.data.html_url);

      - name: Dispatch existing PyPI publisher for v1.3.0
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release.yml",
              ref: "main",
              inputs: { release_tag: "v1.3.0" }
            });
