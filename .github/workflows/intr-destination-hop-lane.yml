name: InTr Destination Hop Lane

# Fabricated mode is the CI default: temporary mesh and ledger roots, far side
# kernel.receipt/build_control_response, labeled non-authentic.
# Live mode is workflow_dispatch only. It reads each candidate organization's
# <org>/.github advertisement from the GitHub API (optional secret
# FEDERATION_READ_TOKEN for private repositories) and then reads
# refs/stegverse/organization-ledger. It does not append. An organization
# whose advertisement or ledger ref cannot be read stays in the matrix as
# UNREACHABLE. It is not dropped because a checkout failed.
#
# Orchestrate mode is workflow_dispatch only, and runs only when Rigel
# dispatches it. It dispatches each organization's intr-destination-hop.yml
# send phase with FEDERATION_HOP_TOKEN (classic PAT, repo + workflow, from an
# account in all eight organizations). The 56 ordered pairs run in 14
# round-robin waves of 4 disjoint organizations, so the shared
# organization-ledger concurrency group never holds two pending runs. Each
# wave waits for the sender ledgers to record ORGANIZATION_EGRESS_CLOSED or
# ORGANIZATION_EGRESS_CLOSURE_REFUSED. Then the live readback runs over every
# ledger. The epochs are supplied (hb_epoch_base); no clock is read for them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: fabricated uses temporary ledgers; live only reads organization-ledger refs
        type: choice
        options:
          - fabricated
          - live
          - orchestrate
        default: fabricated
      hb_epoch_base:
        description: 'orchestrate: supplied epoch of wave 0 (non-negative integer); wave w sends at base + 3w'
        required: false
        default: ''
        type: string
      wave_timeout_seconds:
        description: 'orchestrate: how long one wave may stay open before its open hops are TIMEOUT'
        required: false
        default: '900'
        type: string

permissions:
  contents: read

jobs:
  fabricated:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'fabricated'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: StegVerse-org/.github
          ref: 6e0f1e216f0e2cf1407be7f3f32338080cb8d2c4
          path: _orgs/StegVerse-org
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: StegVerse-Labs/.github
          ref: 6880847e223b32edfb1a10204048d38d4e4adf09
          path: _orgs/StegVerse-Labs
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: SV-LLM/.github
          ref: c0e46aa39f7e4040cf70cd8b8655d1f8d22465ad
          path: _orgs/SV-LLM
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Admissible-Existence/.github
          ref: b6d499be6d15a73630be99fbdc4156403a978ebd
          path: _orgs/Admissible-Existence
          persist-credentials: false

      # Optional checkouts for fabricated mode only. A clone that fails is
      # ignored here. Live mode, not this job, queries all eight organizations
      # and keeps an unreadable advertisement in the hop matrix.
      - name: Try the remaining organization checkouts
        run: |
          set +e
          mkdir -p _orgs
          for spec in \
            "SV-011|_orgs/SV-011" \
            "GCAT-BCAT-Engine|_orgs/GCAT-BCAT-Engine" \
            "StegVerse-002|_orgs/StegVerse-002" \
            "StegGhost|_orgs/StegGhost"
          do
            org="${spec%%|*}"
            dest="${spec##*|}"
            git clone --quiet --depth 1 "https://github.com/${org}/.github.git" "$dest"
            if [ ! -f "$dest/org-runtime/interlock-intr.json" ]; then
              rm -rf "$dest"
            fi
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the SDK
        run: python -m pip install -q -e .

      - name: Lane unit tests
        run: python -m unittest tests.test_intr_destination_hop_lane -v

      - name: Fabricated hop matrix from advertised capabilities
        env:
          INTR_HOP_ORG_ROOTS: ${{ github.workspace }}/_orgs/StegVerse-org:${{ github.workspace }}/_orgs/StegVerse-Labs:${{ github.workspace }}/_orgs/SV-LLM:${{ github.workspace }}/_orgs/Admissible-Existence
        run: |
          set -eu
          python -m unittest tests.test_intr_destination_hop_lane.FabricatedCheckoutTests -v
          args=()
          for root in _orgs/SV-011 _orgs/GCAT-BCAT-Engine _orgs/StegVerse-002 _orgs/StegGhost; do
            if [ -d "$root" ]; then
              args+=(--org-root "$root")
            fi
          done
          python -m stegverse.intr_destination_hop_lane \
            --mode fabricated \
            --reference-root "$GITHUB_WORKSPACE/_orgs/StegVerse-org" \
            --org-root "$GITHUB_WORKSPACE/_orgs/StegVerse-org" \
            --org-root "$GITHUB_WORKSPACE/_orgs/StegVerse-Labs" \
            --org-root "$GITHUB_WORKSPACE/_orgs/SV-LLM" \
            --org-root "$GITHUB_WORKSPACE/_orgs/Admissible-Existence" \
            "${args[@]}" \
            --mesh-root "$RUNNER_TEMP/intr-hop-mesh" \
            --ledger-home "$RUNNER_TEMP/intr-hop-ledgers" \
            --out-dir "$RUNNER_TEMP/intr-hop-lane"
          python - <<'PY'
          import json, os
          report = json.load(open(os.environ["RUNNER_TEMP"] + "/intr-hop-lane/intr-destination-hop-lane.json", encoding="utf-8"))
          assert report["evidence_class"] == "FABRICATED_NON_AUTHENTIC", report["evidence_class"]
          assert report["far_side_authentic"] is False
          assert report["authenticity_claimed"] is False
          assert report["federation_json_is_a_peer_source"] is False
          assert report["counts"]["FAIL"] == 0, report["counts"]
          assert report["counts"]["PASS"] == report["hop_count"] > 0
          print("INTR_DESTINATION_HOP_LANE_FABRICATED_PASS hops=%d" % report["hop_count"])
          PY

      - name: Publish the matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intr-destination-hop-lane
          path: ${{ runner.temp }}/intr-hop-lane
          if-no-files-found: warn

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional. Unset reads public repositories only. A private <org>/.github
      # is read when this secret is configured; an organization that still
      # cannot be read stays in the matrix as UNREACHABLE.
      FEDERATION_READ_TOKEN: ${{ secrets.FEDERATION_READ_TOKEN }}
      # Reads fall back to this when FEDERATION_READ_TOKEN is unset.
      FEDERATION_HOP_TOKEN: ${{ secrets.FEDERATION_HOP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the SDK
        run: python -m pip install -q -e .

      - name: Read advertisements and organization-ledger refs
        run: |
          set -eu
          python -m stegverse.intr_destination_hop_lane \
            --mode live \
            --fetch-ledger-refs \
            --out-dir "$RUNNER_TEMP/intr-hop-lane-live"
          python - <<'PY'
          import json, os
          report = json.load(open(os.environ["RUNNER_TEMP"] + "/intr-hop-lane-live/intr-destination-hop-lane.json", encoding="utf-8"))
          queried = set(report["organizations_queried"])
          expected = {
              "StegVerse-org", "StegVerse-Labs", "SV-LLM", "SV-011",
              "GCAT-BCAT-Engine", "Admissible-Existence", "StegVerse-002", "StegGhost",
          }
          assert queried == expected, sorted(queried)
          peer_orgs = {peer["organization"] for peer in report["peers"]}
          silent = {item["organization"] for item in report["organizations_read_without_intr_destination"]}
          assert queried == peer_orgs | silent, (sorted(peer_orgs), sorted(silent))
          assert report["federation_json_is_a_peer_source"] is False
          assert report["authenticity_claimed"] is False or report["counts"]["PASS"] > 0
          print("INTR_DESTINATION_HOP_LANE_LIVE peers=%d unreachable=%d fail=%d" % (
              len(report["peers"]), report["counts"]["UNREACHABLE"], report["counts"]["FAIL"]))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intr-destination-hop-lane-live
          path: ${{ runner.temp }}/intr-hop-lane-live
          if-no-files-found: warn

  orchestrate:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'orchestrate'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FEDERATION_HOP_TOKEN: ${{ secrets.FEDERATION_HOP_TOKEN }}
      FEDERATION_READ_TOKEN: ${{ secrets.FEDERATION_READ_TOKEN }}
      HB_EPOCH_BASE: ${{ inputs.hb_epoch_base }}
      WAVE_TIMEOUT_SECONDS: ${{ inputs.wave_timeout_seconds }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the SDK
        run: python -m pip install -q -e .

      - name: Dispatch every one-way hop in waves and read every ledger back
        run: |
          set -eu
          if [ -z "${FEDERATION_HOP_TOKEN:-}" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"FEDERATION_HOP_TOKEN_ABSENT","consequence_committed":false}'
            exit 1
          fi
          case "$HB_EPOCH_BASE" in
            ''|*[!0-9]*)
              echo '{"disposition":"FAIL_CLOSED","failure_code":"DISPATCH_HB_EPOCH_INVALID","failed_predicate":"HB_EPOCH_BASE_IS_SUPPLIED_AS_A_NON_NEGATIVE_INTEGER","consequence_committed":false}'
              exit 1 ;;
          esac
          case "$WAVE_TIMEOUT_SECONDS" in
            ''|*[!0-9]*) WAVE_TIMEOUT_SECONDS=900 ;;
          esac
          python -m stegverse.intr_destination_hop_lane \
            --mode orchestrate \
            --hb-epoch-base "$HB_EPOCH_BASE" \
            --wave-timeout-seconds "$WAVE_TIMEOUT_SECONDS" \
            --out-dir "$RUNNER_TEMP/intr-hop-lane-orchestrate"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intr-destination-hop-lane-orchestrate
          path: ${{ runner.temp }}/intr-hop-lane-orchestrate
          if-no-files-found: warn
