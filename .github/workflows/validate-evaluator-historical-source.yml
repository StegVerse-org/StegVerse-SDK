name: Verify exact historical SDK evaluator source restoration
on:
  pull_request:
    paths:
      - 'stegverse/evaluator_historical_source_recovery.py'
      - 'tests/test_evaluator_historical_source_recovery.py'
      - '.github/workflows/validate-evaluator-historical-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current SDK source
        run: python -m pip install -e .
      - name: Compile historical source adapter and tests
        run: python -m py_compile stegverse/evaluator_historical_source_recovery.py tests/test_evaluator_historical_source_recovery.py
      - name: Verify exact original manifest and fail-closed restoration
        run: python -m unittest discover -s tests -p test_evaluator_historical_source_recovery.py -v
