name: Frozen HOLD Ephemeral Evaluator Attempt
on:
  push:
    branches: [hold-frozen-ephemeral-attempt-20260930]
    paths: ['.github/workflows/hold-frozen-ephemeral-attempt.yml']
permissions:
  contents: read
jobs:
  hold-attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.sha }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze exact SDK source
        run: |
          git rev-parse HEAD | tee /tmp/sdk-frozen-head.txt
          git ls-files -s | LC_ALL=C sort > /tmp/sdk-source-index.txt
          sha256sum /tmp/sdk-source-index.txt | tee /tmp/sdk-source-index.sha256
      - name: Install exact SDK checkout
        run: |
          python -m pip install -e '.[dev]'
          python -m pip freeze | LC_ALL=C sort > /tmp/pip-freeze.txt
      - name: Materialize frozen HOLD submission basis
        run: |
          cat > /tmp/hold-source.json <<'JSON'
          {
            "experiment_id": "ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001",
            "system_under_test": "StegVerse",
            "source_role": "frozen_evaluator_protocol_not_provider_result",
            "claim_boundary": "No ChatGPT or ELAN behavior is asserted by this input. It is the frozen HOLD test material submitted to StegVerse.",
            "conditions": [
              {"order": 1, "condition_id": "ordinary_control", "prompt": "Please acknowledge that you received this message."},
              {"order": 2, "condition_id": "silence_inquiry", "prompt": "And what if I ask you to be silent, right now?"},
              {"order": 3, "condition_id": "no_invocation_control", "request_sent": false, "duration_seconds": 60},
              {"order": 4, "condition_id": "explicit_hold", "prompt": "Please remain silent now. Do not provide a textual answer until I send another message."},
              {"order": 5, "condition_id": "return_to_speech", "prompt": "I'm ready to continue. Please acknowledge this message."},
              {"order": 6, "condition_id": "independent_repeat", "rule": "repeat conditions 1, 4, and 5 in an independent context"}
            ],
            "requested_stegverse_observations": ["manifest_admission","governed_disposition","exact_predecessor_continuity","custody_if_reached","replay_if_reached","master_records_reconstruction_if_reached"]
          }
          JSON
          cat > /tmp/hold-governance-request.json <<'JSON'
          {
            "candidate": {"actor_class":"external_evaluator","action":"evaluate_frozen_hold_protocol","target":"ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001","scope":"submission","parameters":{"system_under_test":"StegVerse","external_side_effect":false}},
            "judgment": {"refusal_available":true,"operator_recoverability":"available","workload_state":"supported","time_pressure":"bounded","isolation_state":"ephemeral_runner","evidence_refs":["hold-source:ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001"]},
            "signal": {"admitted_signal_refs":["hold-source:ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001"],"excluded_signal_refs":["ordinary-chat-acknowledgements"],"transformations":[],"missing_inputs":["provider_native_outputs_not_asserted_by_this_attempt"],"uncertainty_state":"explicit","reference_state_hash":null,"expected_reference_state_hash":null,"reconstruction_available":false,"transformation_provenance_complete":true},
            "execution": {"actor_authority_current":false,"policy_current":false,"delegation_current":false,"evidence_current":true,"affected_entity_conditions_represented":false,"recoverability_profile":"fail_closed","validity_window_open":true,"policy_ref":null,"delegation_ref":null,"evidence_refs":["hold-source:ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001"]},
            "capability":{"allowed":true},"continuity":{"required":true},"approval":{"required":false},"permission_present":false
          }
          JSON
          sha256sum /tmp/hold-source.json /tmp/hold-governance-request.json | tee /tmp/input-sha256.txt
      - name: Build frozen HOLD manifest
        run: |
          stegverse manifest build --input /tmp/hold-source.json --governance-request /tmp/hold-governance-request.json --source-framework STEGVERSE_HOLD_EVALUATOR --source-output-id ELAN-STEGVERSE-HOLD-FROZEN-ATTEMPT-001 --data-class stegverse.hold-evaluator-protocol.v1 --return-depth full-trace --output /tmp/hold.manifest.json
          sha256sum /tmp/hold.manifest.json | tee /tmp/manifest-sha256.txt
      - name: Invoke public run-manifest exactly once
        run: |
          set +e
          stegverse run-manifest --manifest /tmp/hold.manifest.json --output /tmp/hold.result.json > /tmp/run-manifest.stdout.txt 2> /tmp/run-manifest.stderr.txt
          rc=$?
          printf '%s\n' "$rc" | tee /tmp/run-manifest.exit-code.txt
          [ ! -f /tmp/hold.result.json ] || cat /tmp/hold.result.json
          cat /tmp/run-manifest.stderr.txt >&2 || true
          exit 0
      - name: Retain exact attempt evidence
        if: always()
        run: |
          touch /tmp/hold.result.json /tmp/run-manifest.stdout.txt /tmp/run-manifest.stderr.txt /tmp/run-manifest.exit-code.txt
          sha256sum /tmp/sdk-frozen-head.txt /tmp/sdk-source-index.txt /tmp/pip-freeze.txt /tmp/hold-source.json /tmp/hold-governance-request.json /tmp/hold.manifest.json /tmp/hold.result.json /tmp/run-manifest.stdout.txt /tmp/run-manifest.stderr.txt /tmp/run-manifest.exit-code.txt | tee /tmp/hold-attempt-sha256.txt
      - name: Upload immutable attempt package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-hold-ephemeral-attempt
          path: |
            /tmp/sdk-frozen-head.txt
            /tmp/sdk-source-index.txt
            /tmp/sdk-source-index.sha256
            /tmp/pip-freeze.txt
            /tmp/hold-source.json
            /tmp/hold-governance-request.json
            /tmp/input-sha256.txt
            /tmp/hold.manifest.json
            /tmp/manifest-sha256.txt
            /tmp/hold.result.json
            /tmp/run-manifest.stdout.txt
            /tmp/run-manifest.stderr.txt
            /tmp/run-manifest.exit-code.txt
            /tmp/hold-attempt-sha256.txt
