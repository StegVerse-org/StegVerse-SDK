name: InTr Destination Hop Lane (orchestrate)

# Orchestrate mode, workflow_dispatch only, so it is never reported as a
# skipped pull-request check (same split as intr-destination-hop-lane-live.yml,
# SDK#543). It runs only when Rigel dispatches it. One run is one
# manifest-directed transition: it reads every organization ledger, derives
# each ordered pair's ledger state, and records one disposition per pair.
# Unsent pairs whose organizations hold no open hop are dispatched (the
# sender's intr-destination-hop.yml send phase), at most one hop per
# organization, so the shared organization-ledger concurrency group never
# holds two pending runs. A dispatched or open hop is
# DURABLE_QUEUE_OR_EVENT_EPHEMERAL_MATERIALIZATION with
# always_on_receiver_required: false. Nothing waits, polls or times out; the
# next run's readback evaluates whatever receipts exist then. Every non-ALLOW
# outcome carries the six fields. The epoch is supplied (hb_epoch); no clock
# is read for it. The credential (FEDERATION_HOP_TOKEN here) is a pending
# owner decision: TV/TVC least-privilege issuance per StegVerse-Labs/.github#2897
# (SDK#537 moves onto TVC#517 for it).

on:
  workflow_dispatch:
    inputs:
      hb_epoch:
        description: 'supplied epoch of this transition''s send dispatches (ASCII digits, at least 32: the HB32 anchor)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEDERATION_HOP_TOKEN: ${{ secrets.FEDERATION_HOP_TOKEN }}
      FEDERATION_READ_TOKEN: ${{ secrets.FEDERATION_READ_TOKEN }}
      HB_EPOCH: ${{ inputs.hb_epoch }}
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install the SDK
        run: python -m pip install -q -e .

      - name: Read every ledger, then record one disposition per hop (dispatch, no wait)
        run: |
          set -eu
          # hb_epoch is resolved first by the shared rule (supplied_epoch_failure):
          # absent is HB_EPOCH_NOT_SUPPLIED; not ASCII [0-9]+ or below 32 (the HB32
          # anchor) is HB_EPOCH_INVALID. Either is FAIL_CLOSED with the six fields,
          # before any read or dispatch. An empty dispatch input is not supplied.
          python - <<'PY'
          import json, os, sys
          from stegverse.intr_destination_hop_lane import hb_epoch_fail_closed, parse_hb_epoch
          supplied = os.environ.get("HB_EPOCH") or None
          if parse_hb_epoch(supplied) is None:
              print(json.dumps(hb_epoch_fail_closed(supplied), sort_keys=True))
              sys.exit(1)
          PY
          if [ -z "${FEDERATION_HOP_TOKEN:-}" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"HOP_DISPATCH_CREDENTIAL_ABSENT","failed_predicate":"HOP_DISPATCH_CREDENTIAL_IS_PRESENT","required_evidence_or_repair":"a credential that dispatches intr-destination-hop.yml send in each sender organization; TV/TVC issuance is the pending owner decision on StegVerse-Labs/.github#2897","retry_entrypoint":".github/workflows/intr-destination-hop-lane-orchestrate.yml hb_epoch=<supplied>","owning_existing_goal":"StegVerse-Labs/.github#2897 / StegVerse-org/.github#162 P0-runtime-and-custody","next_attempt":"dispatch intr-destination-hop-lane-orchestrate.yml once the credential decision lands","consequence_committed":false}'
            exit 1
          fi
          python -m stegverse.intr_destination_hop_lane \
            --mode orchestrate \
            --hb-epoch "$HB_EPOCH" \
            --out-dir "$RUNNER_TEMP/intr-hop-lane-orchestrate"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: intr-destination-hop-lane-orchestrate
          path: ${{ runner.temp }}/intr-hop-lane-orchestrate
          if-no-files-found: warn
