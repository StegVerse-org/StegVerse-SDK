name: TT Evaluator Manifest Tests 1-3

on:
  pull_request:
    paths:
      - 'stegverse/purpose_bound_worker.py'
      - 'stegverse/purpose_bound_worker_processor.py'
      - 'stegverse/atomic_task_worker_binding.py'
      - 'stegverse/atomic_task_worker_processor.py'
      - 'stegverse/manifest_execution.py'
      - 'stegverse/sdk_event_custody.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/route_resolution.py'
      - 'stegverse/evaluator_console.py'
      - 'tests/test_manifest_driven_purpose_worker.py'
      - 'tests/test_evaluator_atomic_task_worker_manifest.py'
      - 'inspection/examples/sdk-tt-shared-source.json'
      - 'inspection/examples/sdk-test1-purpose-worker.processor-request.json'
      - 'inspection/examples/sdk-test2-atomic-task-worker.processor-request.json'
      - 'inspection/examples/sdk-test3-richard-seam.processor-request.json'
      - '.github/workflows/tt-purpose-bound-worker-console.yml'
  workflow_dispatch:

jobs:
  evaluator-manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'

      - name: Validate shared evaluator-level manifest processors
        run: |
          python -m unittest             tests.test_manifest_driven_purpose_worker             tests.test_evaluator_atomic_task_worker_manifest -v

      - name: Test 1 - build manifest exactly as evaluator
        run: |
          stegverse manifest build             --input inspection/examples/sdk-tt-shared-source.json             --processor-request inspection/examples/sdk-test1-purpose-worker.processor-request.json             --source-framework external_evaluator             --source-output-id sdk-test-one-001             --process purpose_bound_worker             --return-depth full-trace             --created-at 2026-09-19T19:45:00Z             --output /tmp/sdk-test1.manifest.json

      - name: Test 1 - run built manifest exactly as evaluator
        run: |
          stegverse run-manifest             --manifest /tmp/sdk-test1.manifest.json             --output /tmp/sdk-test1.result.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sdk-test1.result.json'))
          assert p['evidence_expectations_satisfied'] is True
          assert p['missing_expected_evidence_fields'] == []
          assert p['records_only'] is True
          assert p['worker_live_after_close'] is False
          assert p['master_records_custody_status'] == 'RECORDED'
          assert p['replay_status'] == 'PASS'
          assert p['reconstruction_status'] == 'PASS'
          assert p['required_evidence_validation_status'] == 'PASS'
          assert p['receipt_reconstruction_digest_equal'] is True
          assert p['receipt_sha256'] == p['reconstructed_receipt_sha256']
          assert [r['phase'] for r in p['worker_result']['lifecycle_receipts']] == [
              'MATERIALIZED','INVOCATION_STARTED','TASK_COMPLETED','RETIRED'
          ]
          print('SDK_TEST1_EVALUATOR_MANIFEST_PASS')
          PY

      - name: Test 2 - build manifest exactly as evaluator
        run: |
          stegverse manifest build             --input inspection/examples/sdk-tt-shared-source.json             --processor-request inspection/examples/sdk-test2-atomic-task-worker.processor-request.json             --source-framework external_evaluator             --source-output-id sdk-test-two-001             --process atomic_task_worker             --return-depth full-trace             --created-at 2026-09-19T20:02:00Z             --output /tmp/sdk-test2.manifest.json

      - name: Test 2 - run built manifest exactly as evaluator
        run: |
          stegverse run-manifest             --manifest /tmp/sdk-test2.manifest.json             --output /tmp/sdk-test2.result.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sdk-test2.result.json'))
          assert p['test_number'] == 2
          assert p['scenario'] == 'TEST_2_ATOMIC_TASK_WORKER_BINDING'
          assert p['evidence_expectations_satisfied'] is True
          assert p['records_only'] is True
          assert p['worker_live_after_close'] is False
          assert p['master_records_custody_status'] == 'RECORDED'
          assert p['replay_status'] == 'PASS'
          assert p['reconstruction_status'] == 'PASS'
          assert p['required_evidence_validation_status'] == 'PASS'
          assert p['receipt_reconstruction_digest_equal'] is True
          assert p['receipt_sha256'] == p['reconstructed_receipt_sha256']
          assert [r['phase'] for r in p['records_packet']['lifecycle_receipts']] == [
              'ACTIVATE_TASK_AND_CREATE_BIND_WORKER',
              'INVOCATION_STARTED',
              'TASK_COMPLETED',
              'CLOSE_TASK_AND_RETIRE_WORKER'
          ]
          print('SDK_TEST2_EVALUATOR_MANIFEST_PASS')
          PY

      - name: Test 3 - build manifest exactly as evaluator
        run: |
          stegverse manifest build             --input inspection/examples/sdk-tt-shared-source.json             --processor-request inspection/examples/sdk-test3-richard-seam.processor-request.json             --source-framework external_evaluator             --source-output-id sdk-test-three-001             --process atomic_task_worker             --return-depth full-trace             --created-at 2026-09-19T20:03:00Z             --output /tmp/sdk-test3.manifest.json

      - name: Test 3 - run built manifest exactly as evaluator
        run: |
          stegverse run-manifest             --manifest /tmp/sdk-test3.manifest.json             --output /tmp/sdk-test3.result.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sdk-test3.result.json'))
          assert p['test_number'] == 3
          assert p['scenario'] == 'TEST_3_RICHARD_SHORT_LIVED_ACTOR_SEAM'
          assert p['evidence_expectations_satisfied'] is True
          assert p['records_only'] is True
          assert p['worker_live_after_close'] is False
          assert p['records_packet']['continued_task_bound_authority'] is False
          assert p['master_records_custody_status'] == 'RECORDED'
          assert p['replay_status'] == 'PASS'
          assert p['reconstruction_status'] == 'PASS'
          assert p['required_evidence_validation_status'] == 'PASS'
          assert p['receipt_reconstruction_digest_equal'] is True
          assert p['receipt_sha256'] == p['reconstructed_receipt_sha256']
          print('SDK_TEST3_EVALUATOR_MANIFEST_PASS')
          PY

      - name: Retain evaluator manifests and results for later documentation
        uses: actions/upload-artifact@v4
        with:
          name: sdk-evaluator-tests-1-3-replay-reconstruct-evidence
          path: |
            /tmp/sdk-test1.manifest.json
            /tmp/sdk-test1.result.json
            /tmp/sdk-test2.manifest.json
            /tmp/sdk-test2.result.json
            /tmp/sdk-test3.manifest.json
            /tmp/sdk-test3.result.json
            stegverse-master-records-validation.db
