name: TT Evaluator Test 1 Manifest Runtime (Non-Authorizing)

on:
  pull_request:
    paths:
      - 'stegverse/purpose_bound_worker.py'
      - 'stegverse/purpose_bound_worker_processor.py'
      - 'stegverse/manifest_state_transition_runtime.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/route_resolution.py'
      - 'tests/test_manifest_driven_purpose_worker.py'
      - 'tests/test_universal_manifest_state_transition_runtime.py'
      - 'inspection/examples/sdk-tt-shared-source.json'
      - 'inspection/examples/sdk-test1-purpose-worker.processor-request.json'
      - '.github/workflows/tt-purpose-bound-worker-console.yml'
  workflow_dispatch:

jobs:
  evaluator-test-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'

      - name: Validate Test 1 manifest derivation and working processor route
        run: |
          python -m unittest tests.test_manifest_driven_purpose_worker -v

      - name: Test 1 - build manifest exactly as evaluator
        run: |
          stegverse manifest build \
            --input inspection/examples/sdk-tt-shared-source.json \
            --processor-request inspection/examples/sdk-test1-purpose-worker.processor-request.json \
            --source-framework external_evaluator \
            --source-output-id sdk-test-one-001 \
            --process purpose_bound_worker \
            --return-depth full-trace \
            --created-at 2026-09-19T19:45:00Z \
            --output /tmp/sdk-test1.manifest.json

      - name: Test 1 - run through run-manifest and require assembled lifecycle result
        run: |
          stegverse run-manifest \
            --manifest /tmp/sdk-test1.manifest.json \
            --output /tmp/sdk-test1.result.json
          python - <<'PY'
          import json
          result = json.load(open("/tmp/sdk-test1.result.json", encoding="utf-8"))
          assert result["schema"] == "stegverse.sdk.purpose-bound-worker-manifest-result.v1"
          assert result["evidence_expectations_satisfied"] is True
          assert result["records_only"] is True
          assert result["worker_live_after_close"] is False
          phases = [x["phase"] for x in result["worker_result"]["lifecycle_receipts"]]
          assert phases == ["MATERIALIZED", "INVOCATION_STARTED", "TASK_COMPLETED", "RETIRED"]
          print("TEST1_RUN_MANIFEST_COMPLETED")
          PY

      - name: Retain Test 1 manifest and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: sdk-evaluator-test1-runtime-evidence
          path: |
            /tmp/sdk-test1.manifest.json
            /tmp/sdk-test1.result.json
          if-no-files-found: warn
