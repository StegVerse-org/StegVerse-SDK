name: TT Purpose-Bound Worker Console Validation

on:
  pull_request:
    paths:
      - 'stegverse/purpose_bound_worker.py'
      - 'stegverse/purpose_bound_worker_cost_demo.py'
      - 'stegverse/purpose_bound_worker_processor.py'
      - 'stegverse/manifest_execution.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/route_resolution.py'
      - 'stegverse/evaluator_console.py'
      - 'tests/test_purpose_bound_worker_console.py'
      - 'tests/test_purpose_bound_worker_cost_demo.py'
      - 'tests/test_manifest_driven_purpose_worker.py'
      - 'inspection/examples/tt-purpose-worker.example.json'
      - 'inspection/examples/tt-purpose-worker-cost-demo.example.json'
      - 'inspection/examples/sdk-test1-source.json'
      - 'inspection/examples/sdk-test1-purpose-worker.processor-request.json'
      - 'docs/SDK_CONSOLE.md'
      - 'README.md'
      - 'SDK_TT_PURPOSE_BOUND_WORKER_CONSOLE_MIRROR_HANDOFF.md'
      - 'SDK_TT_PURPOSE_BOUND_WORKER_RUNTIME_PROOF_MIRROR_HANDOFF.md'
      - '.github/workflows/tt-purpose-bound-worker-console.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest tests.test_purpose_bound_worker_console tests.test_purpose_bound_worker_cost_demo tests.test_manifest_driven_purpose_worker -v
      - run: stegverse worker-lifecycle --input inspection/examples/tt-purpose-worker.example.json > /tmp/records-only.json
      - run: python -c "import json; p=json.load(open('/tmp/records-only.json')); assert p['records_only'] is True; assert p['worker_live_after_close'] is False; assert p['runtime_binding_state']=='LOCAL_SEMANTIC_DEMONSTRATION_ONLY'; print('TT_PURPOSE_BOUND_WORKER_CONSOLE_PASS')"
      - run: python -m stegverse.purpose_bound_worker_cost_demo --input inspection/examples/tt-purpose-worker-cost-demo.example.json > /tmp/cost-demo.json
      - run: python -c "import json; p=json.load(open('/tmp/cost-demo.json')); assert p['lifetime_demarcation_seconds']==[15,30,60]; assert p['concurrent_case']['worker_count']==3; assert p['concurrent_case']['simultaneous_overlap_observed'] is True; assert p['concurrent_case']['group_wall_clock_budget_seconds']==30; assert p['all_workers_records_only'] is True; print('TT_PURPOSE_BOUND_WORKER_COST_DEMO_PASS')"
      - name: Build Test One through Manifest Builder
        run: |
          stegverse manifest build \
            --input inspection/examples/sdk-test1-source.json \
            --processor-request inspection/examples/sdk-test1-purpose-worker.processor-request.json \
            --source-framework external_evaluator \
            --source-output-id sdk-test-one-001 \
            --process purpose_bound_worker \
            --return-depth full-trace \
            --created-at 2026-09-19T19:45:00Z \
            --output /tmp/sdk-test1.manifest.json
      - name: Run Test One from the built manifest through SDK
        run: |
          stegverse run-manifest \
            --manifest /tmp/sdk-test1.manifest.json \
            --output /tmp/sdk-test1.result.json
      - name: Assert Test One manifested result
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/sdk-test1.result.json'))
          assert p['evidence_expectations_satisfied'] is True
          assert p['missing_expected_evidence_fields'] == []
          assert p['derived_worker_request']['transition_cell']['candidate']['max_lifetime_seconds'] == 15
          assert [r['phase'] for r in p['worker_result']['lifecycle_receipts']] == ['MATERIALIZED','INVOCATION_STARTED','TASK_COMPLETED','RETIRED']
          assert p['records_only'] is True
          assert p['worker_live_after_close'] is False
          print('SDK_TEST1_MANIFEST_BUILDER_CONSOLE_PASS')
          PY
