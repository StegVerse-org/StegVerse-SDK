name: MIR SV Exp3 SDK Manifest Evidence (Non-Authorizing)
on:
  pull_request:
    branches: [main]
    paths:
      - inspection/examples/mir-sv-exp3/**
      - scripts/build_mir_sv_exp3_manifest.py
      - tests/test_mir_sv_exp3_manifest.py
      - tests/test_universal_manifest_state_transition_runtime.py
      - stegverse/manifest_state_transition_runtime.py
      - docs/MIR_SV_EXP3_MANIFEST.md
      - .github/workflows/mir-sv-exp3-sdk-manifest.yml
  workflow_dispatch:
permissions: {}
jobs:
  sdk-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize exact public source without credentials
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Build exact SDK manifest and read-only diagnostic artifact
        run: |
          set -eu
          cd /tmp/source
          python -m unittest tests.test_mir_sv_exp3_manifest tests.test_universal_manifest_state_transition_runtime.UniversalManifestRuntimeTests.test_source_profile_deny_cannot_be_laundered_into_authentic_intr_result tests.test_universal_manifest_state_transition_runtime.UniversalManifestRuntimeTests.test_source_profile_terminal_fail_closed_cannot_retry tests.test_universal_manifest_state_transition_runtime.UniversalManifestRuntimeTests.test_nonterminal_diagnostic_requires_exact_result_bytes_and_publisher -v
          python -m scripts.build_mir_sv_exp3_manifest --manifest /tmp/mir-sv-exp3.manifest.json --result /tmp/mir-sv-exp3.diagnostic-result.json
          python -m json.tool /tmp/mir-sv-exp3.manifest.json >/dev/null
          python -m json.tool /tmp/mir-sv-exp3.diagnostic-result.json >/dev/null
          sha256sum /tmp/mir-sv-exp3.manifest.json /tmp/mir-sv-exp3.diagnostic-result.json
          echo 'Source/SDK diagnostic only; no resident physical or governed execution authority.'
      - name: Evaluate frozen original against existing central SDK profile (source-only)
        run: |
          set -eu
          mkdir /tmp/exp3-historical-source /tmp/exp3-central
          curl -fsSL "https://github.com/StegVerse-org/StegVerse-SDK/archive/2508068f5475364ed4b47db6f6349e9b91fdb290.tar.gz" -o /tmp/exp3-historical.tgz
          tar -xzf /tmp/exp3-historical.tgz -C /tmp/exp3-historical-source --strip-components=1
          cd /tmp/exp3-historical-source
          python -m scripts.build_mir_sv_exp3_manifest --manifest /tmp/mir-sv-exp3.frozen-original.json
          cd /tmp/source
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from stegverse.manifest_state_transition_runtime import derive_execution_request
          archived=Path('/tmp/mir-sv-exp3.frozen-original.json').read_bytes()
          assert hashlib.sha256(archived).hexdigest() == 'e1b05a082ce19d3d254e3cde1dced03019174a94287724959672c9e65510c8f3', 'HISTORICAL_FILE_DIGEST_MISMATCH'
          historical=json.loads(archived)
          current=json.loads(Path('/tmp/mir-sv-exp3.manifest.json').read_bytes())
          assert current == historical, 'CURRENT_BUILDER_DID_NOT_PRESERVE_FROZEN_EXPERIMENT_3'
          request=derive_execution_request(historical)
          assert request['wire_manifest_sha256']=='ad9b8b8aab2beeea04bff2aac34fd2e7bfa5915133bcaef9209c16de7d9bea68'
          assert request['canonical_task_id'] is None and request['requires_workercoordinator_claim_fence'] is False
          assert historical['completion']['publisher']['required'] is True
          Path('/tmp/mir-sv-exp3.sdk-request.json').write_text(json.dumps(request,sort_keys=True,indent=2)+'\n')
          PY
          curl -fsSL "https://github.com/StegVerse-Labs/.github/archive/f4b234dd1c9e93dc67f0ede2738bbf5b50c54751.tar.gz" -o /tmp/exp3-central.tgz
          tar -xzf /tmp/exp3-central.tgz -C /tmp/exp3-central --strip-components=1
          PYTHONPATH=/tmp/exp3-central:/tmp/source python - <<'PY'
          import copy,json
          from pathlib import Path
          from workers import manifest_state_transition_intr_ingress as central
          from stegverse.manifest_state_transition_runtime import validate_runtime_result
          request=json.loads(Path('/tmp/mir-sv-exp3.sdk-request.json').read_text())
          root=Path('/tmp/exp3-profile-evaluation')
          result=central.execute(root, request)
          assert result['disposition']=='DENY'
          assert result['reason_code']=='ECOSYSTEM_DIAGNOSTIC_NONWORKER_DISPATCH_UNWIRED'
          assert result['authentic_intr_disposition_observed'] is False
          assert result['organization_master_records_closure_observed'] is False
          assert validate_runtime_result(result,request)['disposition']=='DENY'
          exact=Path(result['source_disposition_ref'])
          assert exact.is_file(), 'SOURCE_DENY_RETENTION_REQUIRED'
          for field,invalid in [('request_sha256','0'*64),('authentic_intr_disposition_observed',True)]:
              altered=copy.deepcopy(result);altered[field]=invalid
              try: validate_runtime_result(altered,request)
              except ValueError: pass
              else: raise AssertionError('TAMPER_ACCEPTED:'+field)
          Path('/tmp/mir-sv-exp3.source-profile-deny.json').write_bytes(exact.read_bytes())
          print('SOURCE_ONLY_DENY_VALIDATED; no sovereign ingress or Master Records execution claimed')
          PY
      - name: Upload exact build evidence for third-party recomputation
        uses: actions/upload-artifact@v4
        with:
          name: mir-sv-exp3-sdk-manifest-and-diagnostic
          path: |
            /tmp/mir-sv-exp3.manifest.json
            /tmp/mir-sv-exp3.diagnostic-result.json
            /tmp/mir-sv-exp3.frozen-original.json
            /tmp/mir-sv-exp3.sdk-request.json
            /tmp/mir-sv-exp3.source-profile-deny.json
          if-no-files-found: error
