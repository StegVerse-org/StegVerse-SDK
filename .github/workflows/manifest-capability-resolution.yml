name: Manifest Capability Resolution
on:
  push:
    branches: ["manifest-capability-online-offline-unknown"]
  pull_request:
    paths:
      - "stegverse/capability_resolution.py"
      - "stegverse/capability_graph.py"
      - "stegverse/manifest_builder.py"
      - "tests/test_manifest_capability_resolution.py"
      - "tests/test_capability_graph.py"
      - "tests/test_manifest_builder.py"
      - "tests/test_stegbrowser_manifest_profile.py"
      - "docs/CAPABILITY_GRAPH_DECLARATION.md"
      - ".github/workflows/manifest-capability-resolution.yml"
env:
  # Exact transitive install set (constraints/sdk-install.txt, SDK#484 V-P5).
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile stegverse/capability_resolution.py stegverse/capability_graph.py stegverse/manifest_builder.py
      - run: pytest -q tests/test_manifest_capability_resolution.py tests/test_capability_graph.py tests/test_manifest_builder.py tests/test_stegbrowser_manifest_profile.py

# validation trigger
