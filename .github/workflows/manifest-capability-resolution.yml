name: Manifest Capability Resolution
on:
  push:
    branches: ["manifest-capability-online-offline-unknown"]
  pull_request:
    paths:
      - "stegverse/capability_resolution.py"
      - "stegverse/manifest_builder.py"
      - "tests/test_manifest_capability_resolution.py"
      - "tests/test_manifest_builder.py"
      - "tests/test_stegbrowser_manifest_profile.py"
      - ".github/workflows/manifest-capability-resolution.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[dev]"
      - run: python -m py_compile stegverse/capability_resolution.py stegverse/manifest_builder.py
      - run: pytest -q tests/test_manifest_capability_resolution.py tests/test_manifest_builder.py tests/test_stegbrowser_manifest_profile.py

# validation trigger
