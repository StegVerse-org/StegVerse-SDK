name: Independent HOLD evaluator evidence
on:
  pull_request:
    paths:
      - 'scripts/run_independent_hold_evaluator.py'
      - '.github/workflows/independent-hold-evaluator.yml'
  workflow_dispatch:
jobs:
  hold:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK and screenshot dependencies
        run: |
          python -m pip install -e .
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Execute independent HOLD through actual SDK
        run: python -m scripts.run_independent_hold_evaluator
      - name: Capture evaluator-facing report screen
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1440, "height": 1000}, device_scale_factor=1)
              page.goto(Path("hold-evaluator-artifacts/evaluator.html").resolve().as_uri())
              page.screenshot(path="hold-evaluator-artifacts/evaluator-screen.png", full_page=True)
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-hold-evaluator-evidence
          path: hold-evaluator-artifacts/
          if-no-files-found: warn
