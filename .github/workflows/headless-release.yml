name: Headless Release Boundary Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version candidate to validate'
        required: true
        type: string
      dry_run:
        description: 'Validation-only compatibility input'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  validate-only:
    runs-on: ubuntu-latest
    steps:
      - name: Validate candidate without release authority
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "$CANDIDATE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo 'Invalid semver'; exit 1; }
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          echo 'RELEASE_BOUNDARY_VALIDATED'
          echo 'GitHub Actions has no version-bump, tag, push, GitHub-release, PyPI-publish, or credential authority.'
          echo 'Actual release execution belongs to sovereign/local release tooling under TV/TVC credential authority.'
