name: Public SDK Surface Readiness (Optional Hosted Validation)

on:
  workflow_dispatch:

permissions: {}

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Verify source-level public and evaluator surfaces
        run: |
          set -eu
          cd /tmp/source
          python scripts/verify_public_sdk_surface.py
          python -m unittest tests.test_demo_terms tests.test_evaluation_relationship tests.test_evaluator_llm_entry
          echo 'PUBLIC_SDK_OPTIONAL_HOSTED_VALIDATION_PASS'
          echo 'No package publication, repository mutation, artifact upload, credential retrieval, or authority transition occurs here.'
