name: MCP Source Validation (Non-Authorizing)

on:
  pull_request:
    paths:
      - 'stegverse/mcp_*.py'
      - 'stegverse/sovereign_validation_runtime.py'
      - 'stegverse/sdk_surfaces.py'
      - 'tests/test_mcp_production_artifact.py'
      - 'inspection/examples/mcp-*.json'
      - 'docs/MCP_PRODUCTION_ARTIFACT_TESTS.md'
      - 'pyproject.toml'
      - '.github/workflows/mcp-production-artifact-test.yml'
  workflow_dispatch:

permissions: {}

jobs:
  validate-mcp-source:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1

      - name: Compile MCP source
        run: |
          set -eu
          cd /tmp/source
          python -m compileall -q \
            stegverse/mcp_reference_server.py \
            stegverse/mcp_transport.py \
            stegverse/mcp_governance.py \
            stegverse/mcp_navigation.py \
            stegverse/mcp_cli.py \
            stegverse/sovereign_validation_runtime.py \
            stegverse/sdk_surfaces.py \
            tests/test_mcp_production_artifact.py

      - name: Run credential-free MCP unit tests
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          cd /tmp/source
          python -m unittest tests.test_mcp_production_artifact.MCPProductionArtifactUnitTests -v

      - name: Preserve sovereign integration boundary
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          echo 'MCP_SOURCE_VALIDATION_PASS'
          echo 'Canonical governed integration is assigned to tasks/SDK-MCP-CANONICAL-VALIDATION-009.json.'
          echo 'The hosted runner must not receive a GitHub/private-repository token merely to materialize the private Master Records production package.'
          echo 'This validation job has no runtime, release, credential, or production activation authority.'
