name: Public Import Diagnostic (Optional Hosted)

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize public source anonymously
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          curl -fsSL "https://github.com/${SOURCE_REPO}/archive/${SOURCE_SHA}.tar.gz" -o /tmp/source.tgz
          mkdir /tmp/source
          tar -xzf /tmp/source.tgz -C /tmp/source --strip-components=1
      - name: Run repository public-import diagnostic
        run: |
          set -eu
          cd /tmp/source
          python scripts/verify_public_imports.py
          echo 'PUBLIC_IMPORT_OPTIONAL_HOSTED_PASS'
          echo 'No evidence artifact upload or repository mutation is performed; local execution remains canonical.'
