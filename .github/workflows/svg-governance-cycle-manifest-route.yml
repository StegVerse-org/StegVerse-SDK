name: SVG governance-cycle manifest route
on:
  push:
    branches: [main]
    paths:
      - 'stegverse/route_resolution.py'
      - 'stegverse/svg_governance_cycle_processor.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/manifest_state_transition_runtime.py'
      - 'tests/test_svg_governance_cycle_manifest_route.py'
      - 'tests/test_universal_manifest_state_transition_runtime.py'
      - 'README.md'
      - '.github/workflows/svg-governance-cycle-manifest-route.yml'
  pull_request:
    paths:
      - 'stegverse/route_resolution.py'
      - 'stegverse/svg_governance_cycle_processor.py'
      - 'stegverse/manifest_builder.py'
      - 'stegverse/manifest_state_transition_runtime.py'
      - 'tests/test_svg_governance_cycle_manifest_route.py'
      - 'tests/test_universal_manifest_state_transition_runtime.py'
      - 'README.md'
      - '.github/workflows/svg-governance-cycle-manifest-route.yml'
  workflow_dispatch:
env:
  # Exact transitive install set (constraints/sdk-install.txt, SDK#484 V-P5).
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/sdk-install.txt

jobs:
  svg-manifest-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK
        run: python -m pip install -e .
      - name: Test SVG manifest route
        run: python -m unittest tests.test_svg_governance_cycle_manifest_route -v
      - name: Test universal manifest transition runtime
        run: python -m unittest tests.test_universal_manifest_state_transition_runtime -v
