name: Reusable Release Boundary Validation

on:
  workflow_call:
    inputs:
      version:
        description: 'Version candidate to validate'
        required: true
        type: string
      dry_run:
        description: 'Compatibility input; this workflow is always non-authorizing'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: 'Compatibility input'
        required: false
        type: boolean
        default: false
      pypi_target:
        description: 'Compatibility input only'
        required: false
        type: string
        default: 'pypi'
      package_name:
        description: 'Compatibility input only'
        required: false
        type: string
        default: ''
    outputs:
      tag_name:
        description: 'Validated candidate tag name only; no tag is created'
        value: ${{ jobs.validate.outputs.tag_name }}
      release_url:
        description: 'No hosted release is created'
        value: ''
      pypi_url:
        description: 'No hosted publication is performed'
        value: ''

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.boundary.outputs.tag_name }}
    steps:
      - id: boundary
        name: Validate release candidate without mutation or credentials
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "$CANDIDATE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo 'Invalid semver'; exit 1; }
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${PYPI_API_TOKEN:-}"
          echo "tag_name=v$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo 'REUSABLE_RELEASE_BOUNDARY_VALIDATED'
          echo 'This workflow cannot bump, commit, tag, push, create releases, publish packages, request OIDC credentials, or receive TV/TVC secrets.'
          echo 'Actual release authority is sovereign/local and TV/TVC-governed.'
